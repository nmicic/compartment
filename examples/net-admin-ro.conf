# net-admin-ro.conf — sandbox for read-only network admin / netlink queries
#
# Tools (read-only invocations only): ip, ss, conntrack -L, iptables -L
# / -S, ip6tables -L / -S, arptables -L, ebtables -L, nft list, nstat,
# rtacct, ethtool (query), tc -s, bridge link/fdb show, lsns -t net.
#
# Validated on: Ubuntu 22.04.5 LTS (Jammy), kernel 5.15.0-173-generic,
#               Landlock ABI v1, both root and unprivileged user.
#               Tested invocations: ip addr/route show, ss -tn4,
#               iptables -L (root), conntrack -L (root). Profile syntax
#               is portable across all Landlock-capable kernels (>= 5.13).
#
# Pure read-only profile — these tools query netlink and /proc/net,
# they don't need to write anything to disk. Mostly require root or
# CAP_NET_ADMIN to do anything useful, but `ip route`, `ip addr show`,
# `ss -tlpn` (without process names), and similar reads work as a
# regular user too.
#
# Usage:
#   sudo compartment-user --profile examples/net-admin-ro.conf -- \
#       iptables -L -v -n
#   sudo compartment-user --profile examples/net-admin-ro.conf -- \
#       conntrack -L -p tcp
#   sudo compartment-user --profile examples/net-admin-ro.conf -- \
#       ip -s link show
#   sudo compartment-user --profile examples/net-admin-ro.conf -- \
#       ss -tunap
#   sudo compartment-user --profile examples/net-admin-ro.conf -- \
#       nft list ruleset
#
# What this DOES prevent:
#   - Any disk write (so a compromised iptables binary can't drop a
#     payload to /etc/cron.d, /root/.ssh, etc.)
#   - Loading kernel modules (e.g. xt_recent, nf_conntrack_ftp) — many
#     iptables match modules trigger an autoload via init_module/finit_module
#     when first invoked. If you legitimately need module autoload, run
#     once outside the sandbox to warm the kernel, then enforce the profile.
#   - eBPF, ptrace, kexec, mount, anything destructive
#
# What this does NOT prevent:
#   - Read-only inspection IS the whole point — it does NOT block
#     iptables-save dumping ruleset to stdout, or `ss -p` showing pids
#     (which leaks process names). If you redirect that to a file,
#     Landlock will deny the write outside the (none) writable paths.
#   - Reading /etc files (Landlock ABI v1 limitation).
#
# CAUTION: do NOT use this profile for write operations. `iptables -A`,
# `ip route add`, `nft add`, `tc qdisc add` will appear to "work"
# (netlink doesn't go through Landlock) but any state file write to
# /etc/iptables/, /etc/nftables.conf etc. will be denied.

# ── Filesystem (read-only everywhere) ──
ro /usr
ro /lib
ro /lib64
ro /bin
ro /sbin
ro /etc
ro /proc
ro /sys
ro /run
ro /dev

# Deliberately NO writable paths.

# ── Syscalls ──
# These tools rely on socket(AF_NETLINK,...) — leave socket() alone.
# We block module loading because iptables match modules can autoload,
# and we don't want a sandboxed query to ask the kernel to insmod xt_*.
block ptrace
block mount
block umount2
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block unshare
block setns
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd
block ioperm
block iopl

# ── Environment ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH
env-deny XTABLES_LIBDIR
env-deny IPTABLES_PARSER

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
