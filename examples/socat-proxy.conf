# socat-proxy.conf — Compartment profile for the socat TCP bridge
#
# Used in the paranoid SSH setup: socat bridges a local port to the
# remote SSH server. This profile ensures socat can ONLY do networking
# — it cannot read SSH keys, credentials, or any sensitive user files.
#
# Usage (as part of paranoid-ssh.sh):
#   compartment-user --profile examples/socat-proxy.conf -- \
#       socat TCP-LISTEN:2222,bind=127.0.0.1,reuseaddr TCP:remote:62222
#
# What this prevents:
#   - If socat is exploited, attacker cannot read ~/.ssh/ or $HOME
#   - socat cannot write to the filesystem (no log exfiltration)
#   - socat cannot escalate privileges or load kernel modules

# ── Filesystem: absolute minimum for socat to run ──
ro /usr
ro /lib
ro /lib64
ro /etc
ro /run
rw /dev
ro /proc

# NOTE: no access to $HOME, ~/.ssh, or any user data

# ── Syscalls: block dangerous operations ──
block ptrace
block mount
block umount2
block pivot_root
block chroot
block unshare
block setns
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd

# ── Environment: strip everything dangerous ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny SSH_AUTH_SOCK

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
