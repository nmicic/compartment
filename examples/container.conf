#
# container.conf — full namespace isolation (compartment-root)
#
# Use with: compartment-root --profile container -- /bin/sh
# Or place at: /etc/compartment/container.conf
#
# Syscall allow-list derived from glibc runtime requirements.
# This covers most server workloads. Add more as needed.

# ── Namespace (compartment-root only) ──
rootdir /srv/containers/default
uid 1000
gid 1000
username svc
loopback on

# ── Capabilities (compartment-root only) ──
# Only keep what the service needs — everything else is dropped
# cap-allow CAP_NET_BIND_SERVICE

# ── Syscalls (allow-list: everything not listed is blocked) ──
allow read
allow write
allow open
allow openat
allow close
allow stat
allow fstat
allow lstat
allow newfstatat
allow statx
allow mmap
allow mprotect
allow munmap
allow brk
allow rt_sigaction
allow rt_sigprocmask
allow rt_sigreturn
allow ioctl
allow access
allow faccessat
allow faccessat2
allow execve
allow execveat
allow exit
allow exit_group
allow arch_prctl
allow set_tid_address
allow set_robust_list
allow futex
allow getpid
allow getuid
allow getgid
allow geteuid
allow getegid
allow getppid
allow gettid
allow getdents64
allow getcwd
allow chdir
allow dup
allow dup2
allow dup3
allow pipe
allow pipe2
allow fcntl
allow select
allow poll
allow ppoll
allow lseek
allow pread64
allow pwrite64
allow readv
allow writev
allow readlink
allow readlinkat
allow getrandom
allow clock_gettime
allow clock_getres
allow clock_nanosleep
allow nanosleep
allow gettimeofday
allow prctl
allow sigaltstack
allow madvise
allow mremap
allow sched_getaffinity
allow sched_yield
allow getrlimit
allow prlimit64
allow uname
allow umask
allow wait4
allow waitid
allow clone
allow clone3
allow fork
allow vfork
allow kill
allow tgkill
allow rseq
allow membarrier
allow close_range
allow fadvise64
allow rename
allow renameat2
allow unlink
allow unlinkat
allow mkdir
allow mkdirat
allow rmdir
allow chmod
allow fchmod
allow chown
allow fchown
allow setuid
allow setgid
allow setgroups
allow setsid

# ── Environment ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT

# ── Features ──
seccomp on
no-new-privs on
env-sanitize on

# ── Audit ──
audit on
audit-log /var/tmp/compartment-audit-containers
