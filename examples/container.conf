# container.conf — full namespace isolation (compartment-root ONLY)
#
# Use with: compartment-root --profile container -- /bin/sh
# Or place at: /etc/compartment/container.conf
#
# THIS PROFILE IS NOT USABLE WITH compartment-user.
#   It declares no ro/rw/rwx rules (Landlock is opt-in in compartment-root and
#   this profile does not turn it on), so compartment-user exits 1 with
#       "landlock enabled but no paths configured"
#   That refusal is correct — the profile has nothing to tell Landlock — but
#   the message does not say which tool to use, so: use compartment-root.
#
# Syscall allow-list derived from glibc runtime requirements.  It covers a
# single-process CLI workload: start, read and write files, fork, exit.
#
# It also covers a network service: the socket, epoll, eventfd, timerfd and
# signalfd families are listed in the "Network / event syscalls" section at
# the end.  Comment that block out for a workload that has no business
# opening a socket at all.

# ── Namespace (compartment-root only) ──
rootdir /srv/containers/default
uid 1000
gid 1000
username svc
loopback on

# ── Capabilities (compartment-root only) ──
# Only keep what the service needs — everything else is dropped
# cap-allow CAP_NET_BIND_SERVICE

# ── Syscalls (allow-list: everything not listed is blocked) ──
allow read
allow write
allow open
allow openat
allow close
allow stat
allow fstat
allow lstat
allow newfstatat
allow statx
allow mmap
allow mprotect
allow munmap
allow brk
allow rt_sigaction
allow rt_sigprocmask
allow rt_sigreturn
allow ioctl
allow access
allow faccessat
allow faccessat2
allow execve
allow execveat
allow exit
allow exit_group
allow arch_prctl
allow set_tid_address
allow set_robust_list
allow futex
allow getpid
allow getuid
allow getgid
allow geteuid
allow getegid
allow getppid
allow gettid
allow getdents64
allow getcwd
allow chdir
allow dup
allow dup2
allow dup3
allow pipe
allow pipe2
allow fcntl
allow select
allow poll
allow ppoll
allow lseek
allow pread64
allow pwrite64
allow readv
allow writev
allow readlink
allow readlinkat
allow getrandom
allow clock_gettime
allow clock_getres
allow clock_nanosleep
allow nanosleep
allow gettimeofday
allow prctl
allow sigaltstack
allow madvise
allow mremap
allow sched_getaffinity
allow sched_yield
allow getrlimit
allow prlimit64
allow uname
allow umask
allow wait4
allow waitid
allow clone
allow clone3
allow fork
allow vfork
allow kill
allow tgkill
allow rseq
allow membarrier
allow close_range
allow fadvise64
allow rename
allow renameat2
allow unlink
allow unlinkat
allow mkdir
allow mkdirat
allow rmdir
allow chmod
allow fchmod
allow chown
allow fchown
allow setuid
allow setgid
allow setgroups
allow setsid

# ── Network / event syscalls ──
#
# Comment this block out for a workload that must not open a socket.
#
# Do NOT substitute raw syscall numbers if you extend it.  Numbers are
# architecture specific — 41 is socket on x86_64 and pivot_root on aarch64 —
# so a numeric allow-list in a shipped profile is a portability trap.
#
# accept is x86-64 only (aarch64 has accept4 alone) and is therefore listed
# by name here; on an architecture without it the loader warns and skips the
# line, which is why the block also lists accept4.
#
allow socket
allow socketpair
allow bind
allow listen
allow accept
allow accept4
allow connect
allow getsockname
allow getpeername
allow setsockopt
allow getsockopt
allow sendto
allow recvfrom
allow sendmsg
allow recvmsg
allow shutdown
allow epoll_create1
allow epoll_ctl
allow epoll_wait
allow epoll_pwait
allow eventfd2
allow timerfd_create
allow timerfd_settime
allow timerfd_gettime
allow signalfd4
allow pselect6
allow openat2
allow statfs
allow fstatfs
allow sysinfo
allow getpgrp
allow setpgid
allow restart_syscall
allow sched_setaffinity
allow getgroups

# ── Environment ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT

# ── Features ──
#
# The container's PID 1 reaper installs this filter too, because wait4,
# kill, rt_sigaction, rt_sigprocmask, rt_sigreturn, exit_group and write are
# all listed above.  Remove any of them and PID 1 silently stays unfiltered
# (--verbose says so) rather than dying on its first waitpid().
seccomp on
no-new-privs on
env-sanitize on

# ── Audit ──
audit on
audit-log /var/log/compartment
