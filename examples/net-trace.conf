# net-trace.conf — sandbox profile for raw-socket diagnostic tools
#
# Tools: ping, traceroute, mtr, nmap, arping, hping3, nping, ndisc6
#
# Validated on: Ubuntu 22.04.5 LTS (Jammy), kernel 5.15.0-173-generic,
#               Landlock ABI v1, with ping/traceroute/nmap/mtr installed
#               from the Ubuntu archive. Profile syntax is portable
#               across all Landlock-capable kernels (>= 5.13).
# Read-only profile. NOTHING is writable. Output goes to terminal only.
#
# Usage (raw sockets need root or file caps):
#   sudo compartment-user --profile examples/net-trace.conf -- ping -c 3 1.1.1.1
#   sudo compartment-user --profile examples/net-trace.conf -- traceroute 1.1.1.1
#   sudo compartment-user --profile examples/net-trace.conf -- mtr -c 5 1.1.1.1
#   sudo compartment-user --profile examples/net-trace.conf -- \
#       nmap -sS -p 22,80,443 192.0.2.1
#
# What this DOES prevent (even when running as root with CAP_NET_RAW):
#   - Any disk write — no log/state/pcap/output file can land anywhere
#   - Reading $HOME or /root (those paths are not mapped)
#   - nmap NSE scripts writing loot to disk
#   - Loading kernel modules, mounting filesystems, eBPF abuse
#   - ptrace, kexec, reboot
#
# What this does NOT prevent on Landlock ABI v1 (kernel < 5.19):
#   - Reading files inside /etc (/etc/shadow, /etc/sudoers, etc.).
#     These tools need /etc for nsswitch/ld.so.cache/services, and
#     ABI v1 cannot enforce file-level grants.
#
# NOTE: nmap with --script needs ro access to /usr/share/nmap (covered
# by the blanket `ro /usr` below). Output formats that write files
# (-oN, -oX, -oA) need `rw /tmp` — copy this file and add it.

# ── Filesystem (read-only everywhere) ──
ro /usr
ro /lib
ro /lib64
ro /bin
ro /sbin
ro /etc
ro /proc
ro /sys
ro /run
ro /dev

# Deliberately NO `rw /tmp`. If you need nmap -oA, copy this file and
# add `rw /tmp`.

# ── Syscalls ──
block ptrace
block mount
block umount2
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block unshare
block setns
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd
block ioperm
block iopl

# ── Environment ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH
# nmap-specific: prevent NSE script directory override
env-deny NMAPDIR

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
