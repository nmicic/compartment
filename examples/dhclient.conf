# dhclient.conf — sandbox profile for the ISC DHCP client
#
# Tools: dhclient (and reasonably similar: udhcpc, dhcpcd)
#
# Validated on: Ubuntu 22.04.5 LTS (Jammy), kernel 5.15.0-173-generic,
#               Landlock ABI v1, root only. Tested with isc-dhcp-client
#               4.4.1 — profile loads, allows writes to /var/lib/dhcp
#               and /run, denies writes to /etc/passwd. Live `dhclient
#               <iface>` was NOT exercised (would reconfigure the test
#               VM's network); needs validation in a throwaway netns.
#
# dhclient is genuinely awkward to sandbox: it needs raw IP sockets
# (CAP_NET_RAW + CAP_NET_BIND_SERVICE for port 68), reads/runs scripts
# from /etc/dhcp/dhclient-{enter,exit}-hooks.d/, writes lease state to
# /var/lib/dhcp/, writes a pid file, and traditionally rewrites
# /etc/resolv.conf when it gets DNS info from the server.
#
# This profile is meant for the "modern" case where DNS is handled by
# resolvconf, systemd-resolved, or NetworkManager — i.e. dhclient
# itself does NOT directly clobber /etc/resolv.conf.
#
# Usage (must run as root for raw socket + low-port bind):
#   sudo compartment-user --profile examples/dhclient.conf -- \
#       dhclient -1 -v ens3
#
# What this DOES prevent:
#   - dhclient (or a hook script) writing anywhere outside /var/lib/dhcp,
#     /run, /tmp — no overwriting /root/.ssh/authorized_keys, no log
#     splatter in $HOME, etc.
#   - Loading kernel modules from a malicious lease file
#   - eBPF abuse, ptrace, kexec, mount
#
# What this does NOT prevent on Landlock ABI v1 (kernel < 5.19):
#   - Reading sensitive files in /etc — see comment in tcpdump.conf for
#     why we have to grant `ro /etc` wholesale. dhclient also reads
#     /etc/dhcp/dhclient.conf and runs scripts from /etc/dhcp/*-hooks.d/,
#     so /etc must be readable+executable.
#
# What this does NOT cover:
#   - Direct /etc/resolv.conf rewrite. If your dhclient setup writes
#     resolv.conf directly, add `rw /etc/resolv.conf` (fragile on ABI v1
#     — see file-level grant note). Better: switch to resolvconf or
#     systemd-resolved so resolv.conf updates happen out-of-band.
#   - dhcpv6: same shape, but you may need additional state paths
#     (/var/lib/dhcpv6, /run/dhclient6.* etc.).

# ── Filesystem ──
ro /usr
ro /lib
ro /lib64
ro /bin
ro /sbin
ro /etc
ro /proc
ro /sys
ro /dev

# Lease database, runtime state, pid file.
rw /var/lib/dhcp
rw /run
rw /tmp

# ── Syscalls ──
# dhclient legitimately uses raw IP sockets; do NOT block socket().
# We block the same destructive ops as elsewhere.
block ptrace
block mount
block umount2
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd
block ioperm
block iopl

# NOTE: dhclient does fork+exec hooks and may unshare for namespacing;
# we leave clone/unshare/setns alone to avoid breaking interface scripts.

# ── Environment ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
