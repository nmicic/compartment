# tcpdump.conf — sandbox profile for packet-capture tools
#
# Tools: tcpdump, tshark, dumpcap, nfcapd
#
# Validated on: Ubuntu 22.04.5 LTS (Jammy), kernel 5.15.0-173-generic,
#               Landlock ABI v1. Profile syntax is portable across all
#               Landlock-capable kernels (>= 5.13); behaviour on ABI v2+
#               is stricter (file-level rules become effective).
# Capture files (-w) MUST land in /tmp; nowhere else is writable.
# A read-only run (no -w) works without changes — same profile fits both.
#
# Usage (raw sockets need root or file caps):
#   sudo compartment-user --profile examples/tcpdump.conf -- \
#       tcpdump -i eth0 -c 10 -w /tmp/cap.pcap
#
#   sudo compartment-user --profile examples/tcpdump.conf -- \
#       tshark -i eth0 -c 10
#
# What this DOES prevent (even when running as root with CAP_NET_RAW):
#   - Capture files written outside /tmp (e.g. -w /root/.ssh/cap.pcap)
#   - Writing logs, scripts, or any artifact to $HOME, /root, /etc, /var
#   - Loading kernel modules, mounting filesystems, eBPF abuse
#   - ptrace of other processes, kexec, reboot
#
# What this does NOT prevent on Landlock ABI v1 (kernel < 5.19):
#   - Reading sensitive files in /etc such as /etc/shadow, /etc/sudoers,
#     /etc/ssh/ssh_host_*_key. Landlock ABI v1 only enforces directory-
#     level rules; file-level rules are silently ineffective on most 5.13–
#     5.18 kernels. tcpdump needs /etc for nsswitch/ld.so.cache, so we
#     grant the whole tree.
#   - For tighter read isolation, run on kernel >= 5.19 (ABI v2+) and
#     replace `ro /etc` with the per-file grants commented below; or use
#     compartment-root with a bind-mounted /etc subset.
#
# NOTE: tcpdump auto-drops privileges to user "tcpdump" by default,
# which fails under PR_SET_NO_NEW_PRIVS. Pass `-Z root` to disable the
# drop:  tcpdump -Z root -i eth0 -w /tmp/cap.pcap
# (You'll see "Couldn't find user 'root'" — that's the priv-drop
# attempt failing harmlessly; capture still proceeds.)

# ── Filesystem ──
ro /usr
ro /lib
ro /lib64
ro /bin
ro /sbin
ro /etc
ro /proc
ro /sys
ro /run
ro /dev

# Capture files only here.
rw /tmp

# Per-file alternative (uncomment + remove `ro /etc` above; needs kernel
# >= 5.19 / Landlock ABI v2 to be effective):
#   ro /etc/ld.so.cache
#   ro /etc/ld.so.conf
#   ro /etc/ld.so.conf.d
#   ro /etc/group
#   ro /etc/passwd
#   ro /etc/nsswitch.conf
#   ro /etc/protocols
#   ro /etc/services

# NOTE: $HOME deliberately NOT mapped. tshark may complain that it
# can't write ~/.config/wireshark — that's the point. Pre-create
# config out-of-band if you need it.

# ── Syscalls (block dangerous; capture syscalls untouched) ──
# Capture itself uses: socket, setsockopt (cBPF filter), recvfrom,
# mmap (TPACKET_V3 ring), poll. None of these are blocked.
block ptrace
block mount
block umount2
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block unshare
block setns
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd
block ioperm
block iopl

# ── Environment ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH
env-deny WIRESHARK_DATA_DIR
env-deny WIRESHARK_CONFIG_DIR
env-deny WIRESHARK_PYTHON_DIR

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
