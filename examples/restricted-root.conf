#
# restricted-root.conf — a service container with a binary allow-list
#
# Use with: compartment-root --profile restricted-root.conf -- /usr/bin/exampled
#
# The scenario: one service, running as its own unprivileged user inside a
# namespace container, that may execute a short list of binaries, may not
# write to most of its own filesystem, and may open exactly one outbound
# TCP port — a PostgreSQL server on 5432.
#
# ── What this DOES guarantee ──────────────────────────────────────────
#
#   * Only the binaries named by an `exec` rule below can be executed, by
#     anyone in the container, including uid 0 if it ever gets there.
#     Landlock rules are inherited by every child and can only be narrowed,
#     never widened, and no-new-privs is on unconditionally.
#   * The container root is read-only, nosuid and nodev; /tmp is writable
#     but noexec, so a downloaded payload cannot be run from it.
#   * Only TCP port 5432 can be connect()ed to, and no port can be bound.
#     A reverse shell to any other port fails with EACCES in the kernel,
#     before the packet exists.
#   * The service filesystem is /srv/exampled/data and nothing else is
#     writable outside /tmp, /dev and /run.
#
# ── What this does NOT guarantee ──────────────────────────────────────
#
#   * It is not an exec ACL keyed on *who* execs.  Landlock policy belongs
#     to the sandbox, not to a caller: you cannot say "the supervisor may
#     run psql but the request handler may not".  That needs a BPF LSM.
#   * The Landlock network rules are TCP only.  UDP, unix sockets, netlink
#     and raw sockets are untouched — a DNS query on UDP/53 still works,
#     and so would exfiltration over UDP.  There is also no listen/accept
#     granularity and no per-address rule: `net-connect 5432` allows
#     connecting to port 5432 on *any* address, v4 and v6 alike.
#   * Landlock cannot express "everything except port N".  The port rules
#     are an allow-list; `net-default deny` plus the ports you need is the
#     only shape available.  A deny-list needs the BPF sibling tool.
#   * An `exec` allow-list only distinguishes binaries by inode.  A busybox
#     rootdir, where every applet is a symlink to one multi-call binary,
#     cannot be split up this way: allowing /bin/sh allows every applet.
#   * The shell can still read anything a `ro` rule covers, and a shell
#     builtin is not an exec at all.  Do not list a shell in the allow-list
#     unless the service genuinely needs one.
#   * Landlock ABI v4 (Linux 6.7) is the minimum for the `net-*` rules.
#     Below it compartment-root warns loudly and the port policy is NOT
#     active; the filesystem rules still are.

# ── Namespace ──
rootdir  /srv/exampled/root
username exampled
# The rootdir must be root-owned and not group- or world-writable under the
# default identity uid map.  With a shifted `uid-map`, it may instead be
# owned by the host uid the container's root maps to.

# ── Root filesystem hardening ──
# nosuid and nodev are applied unconditionally and cannot be turned off;
# these two are on top.  `ro` is applied after /proc, /dev and /sys are in
# place, and is not recursive, so those three stay writable.
rootdir-flags nosuid,nodev,ro

# A writable scratch area that nothing can be executed from.
mount-noexec /tmp
mount-nosuid /tmp
mount-nodev  /tmp

# ── Landlock: the binary allow-list ──
landlock on

# Read-only system paths.  These carry READ_FILE and READ_DIR — note that
# `ro` on a directory also grants EXECUTE on everything beneath it, which is
# exactly what an allow-list must not do, so no directory holding binaries
# appears here.
ro /etc
ro /usr/lib
ro /usr/share
ro /lib64?
ro /proc
ro /run

# The executables, one rule per file.  A rule on a regular file carries only
# the file-level rights, so this is a genuine per-binary grant.
#
# The dynamic loader has to be listed: execve() opens the ELF interpreter
# with FMODE_EXEC and Landlock checks EXECUTE on it.  Shared libraries do
# NOT need it — ld.so opens them read-only — which is why `ro /usr/lib`
# above is enough for libc and friends.
exec /lib64/ld-linux-x86-64.so.2?
exec /usr/bin/exampled
exec /usr/bin/psql
exec /usr/bin/cat

# Writable state.  W^X: read and write, no execute.
rw /srv/exampled/data
rw /tmp
rw /dev/null
rw /dev/zero
rw /dev/urandom
rw /dev/random
rw /dev/log?

# ── Landlock: the network ──
# TCP only.  `net-default deny` handles both bind and connect, so with only
# a connect rule below, every bind() fails too — including the explicit
# bind(port 0) some clients do before connecting.  Add `net-bind 0` if the
# service needs one.
net-connect 5432
net-default deny

# ── Capabilities ──
# Everything is dropped from the bounding set unless named here.  A service
# that binds a privileged port would add `cap-allow CAP_NET_BIND_SERVICE`.

# ── Syscalls ──
# The built-in deny-list (43 syscalls: ptrace, the mount and namespace API,
# module loading, the keyring, bpf, io_uring, ...) is installed when no
# `allow`/`block` line appears.  For a tighter policy, start from
# examples/container.conf's allow-list.
seccomp on
seccomp-default errno
# `seccomp-default kill` turns a denied syscall into SIGSYS instead of
# EPERM.  That is the safer default for anything that does not check return
# values, at the cost of a hard crash where the program might have coped.

# ── Environment ──
env-deny LD_*
env-deny GLIBC_TUNABLES
env-deny GCONV_PATH
env-deny PGPASSWORD

# ── Features ──
no-new-privs on
env-sanitize on
