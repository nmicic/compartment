#
# restricted-root.conf — a service container with a binary allow-list
#
# Use with: compartment-root --profile restricted-root.conf -- /usr/bin/exampled
#
# The scenario: one service, running as its own unprivileged user inside a
# namespace container, that may execute a short list of binaries, may not
# write to most of its own filesystem, and may open exactly one outbound
# TCP port — a PostgreSQL server on 5432.
#
# ── What this DOES guarantee ──────────────────────────────────────────
#
#   * The files that can be the target of an `execve(2)` are the ones named
#     by an `exec` rule below, plus anything beneath a `ro` directory rule:
#     `ro` on a directory carries EXECUTE on every file under it.  The `ro`
#     rules left in this profile are /etc, /proc and /run; the directories
#     that hold libraries and read-only data are granted `rw` instead, for
#     the reason given where they appear.  Audit the `ro` list against the
#     rootdir you actually ship.
#   * Whatever the list comes to, it is the same for everyone in the
#     container, including uid 0 if it ever gets there.  Landlock rules are
#     inherited by every child and can only be narrowed, never widened, and
#     no-new-privs is on unconditionally.
#   * Being an `execve(2)` target is not the same as being the only code
#     that can run, and this profile lists the dynamic loader, which gives
#     up even that much — read the box below before treating any of this
#     as a boundary.
#   * The container root is read-only, nosuid and nodev, and the library
#     and read-only-data trees are read-only *including any submount they
#     carry* — `rootdir-flags ro` is not recursive, `mount-ro` is, and both
#     are used below.  /tmp is writable but noexec, so a downloaded payload
#     cannot be run from it.
#   * Only TCP port 5432 can be connect()ed to, and no port can be bound.
#     A reverse shell to any other port fails with EACCES in the kernel,
#     before the packet exists.
#   * The service filesystem is /srv/exampled/data — which has to be a
#     mount of its own, see the rule below — and nothing else is writable
#     outside /tmp and the device nodes.
#
# ┌───────────────────────────────────────────────────────────────────┐
# │ THE EXEC ALLOW-LIST IS A HARDENING LAYER, NOT AN EXEC-TARGET      │
# │ BOUNDARY, IN THIS PROFILE.                                        │
# │                                                                   │
# │ This profile lists the dynamic loader, because every dynamically  │
# │ linked binary needs it (see the `exec` block below).  A listed    │
# │ loader can also be invoked as a program in its own right:         │
# │                                                                   │
# │     /lib64/ld-linux-x86-64.so.2 /srv/exampled/data/payload        │
# │                                                                   │
# │ That starts `payload` with no `execve(2)` of it, and so no        │
# │ execute check on it.  The loader opens the target read-only and   │
# │ maps it PROT_EXEC, and Landlock has no mmap hook — the same fact  │
# │ that lets a shared library load on read access alone.  IF THE    │
# │ CONTAINER CAN READ A COMPATIBLE LOADABLE ELF, IT CAN RUN IT.     │
# │                                                                   │
# │ `rw` grants read, so `rw /srv/exampled/data` below is a place the │
# │ service can write an ELF and then start it.  Measured on 6.8 and  │
# │ 7.0: the direct execve is refused with EACCES and the loader runs │
# │ the same file.                                                    │
# │                                                                   │
# │ Two shapes close the direct-loader bypass and give back the       │
# │ exec-target boundary:                                             │
# │   (a) static-link the allowed binaries and do not list the        │
# │       loader — an unlisted loader cannot be executed either, so a │
# │       dynamically linked payload cannot start at all; or          │
# │   (b) grant no location that is both readable and writable, and   │
# │       leave no readable unlisted ELF.                             │
# │                                                                   │
# │ `mount-noexec` over a writable area closes the writable-payload   │
# │ half of the bypass and only that half — the kernel refuses the    │
# │ loader's PROT_EXEC mapping on a MNT_NOEXEC mount, which is why    │
# │ /tmp below is safe and /srv/exampled/data is not.  It does        │
# │ nothing about a readable unlisted ELF on an exec-capable mount,   │
# │ so it is not a third complete answer.                             │
# │                                                                   │
# │ NONE OF THE THREE MAKES THIS A CODE-EXECUTION BOUNDARY.  An       │
# │ exec-target boundary bounds which files can be started by name.   │
# │ An allowed program that is compromised can still interpret, JIT,  │
# │ dlopen or otherwise map code of its own choosing, and no rule in  │
# │ this file sees any of that.                                       │
# │                                                                   │
# │ A kernel-side exec confinement that does not need the loader      │
# │ listed is designed and not shipped.  Full statement: HOWTO.md,    │
# │ "`exec` on a file: a binary allow-list", fact 5.                  │
# └───────────────────────────────────────────────────────────────────┘
#
# ── What this does NOT guarantee ──────────────────────────────────────
#
#   * It is not an exec ACL keyed on *who* execs.  Landlock policy belongs
#     to the sandbox, not to a caller: you cannot say "the supervisor may
#     run psql but the request handler may not".  That needs a BPF LSM.
#   * The Landlock network rules are TCP only.  UDP, unix sockets, netlink
#     and raw sockets are untouched — a DNS query on UDP/53 still works,
#     and so would exfiltration over UDP.  There is also no listen/accept
#     granularity and no per-address rule: `net-connect 5432` allows
#     connecting to port 5432 on *any* address, v4 and v6 alike.
#   * Landlock cannot express "everything except port N".  The port rules
#     are an allow-list; `net-default deny` plus the ports you need is the
#     only shape available.  A deny-list needs the BPF sibling tool.
#   * An `exec` allow-list only distinguishes binaries by inode.  A busybox
#     rootdir, where every applet is a symlink to one multi-call binary,
#     cannot be split up this way: allowing /bin/sh allows every applet.
#   * The shell can still read anything a `ro` rule covers, and a shell
#     builtin is not an exec at all.  Do not list a shell in the allow-list
#     unless the service genuinely needs one.
#   * With the loader listed, the allow-list does not even bound what can
#     be started — the loader starts a compatible loadable ELF for it, and
#     `rw /srv/exampled/data` below is readable, writable and on an
#     exec-capable mount, which is all that route needs.  See the box in
#     the header.
#   * No shape of this profile bounds what code an allowed binary runs once
#     it is started.  An interpreter, a JIT, a `dlopen` or a plain
#     `mmap(PROT_EXEC)` of bytes it fetched itself are all invisible to
#     Landlock, which hooks `open`, not `mmap`.
#   * Landlock ABI v4 (Linux 6.7) is the minimum for the `net-*` rules.
#     Below it compartment-root warns loudly and the port policy is NOT
#     active; the filesystem rules still are.

# ── Namespace ──
rootdir  /srv/exampled/root
username exampled
# The rootdir must be root-owned and not group- or world-writable under the
# default identity uid map.  With a shifted `uid-map`, it may instead be
# owned by the host uid the container's root maps to.

# ── Root filesystem hardening ──
# nosuid and nodev are applied unconditionally and cannot be turned off;
# these two are on top.  `ro` is applied after /proc, /dev and /sys are in
# place, and is not recursive: it covers the rootdir mount and nothing
# stacked on top of it, so those three stay writable — and so does any
# other submount.  `mount-ro PATH` below is the recursive form.
rootdir-flags nosuid,nodev,ro

# A writable scratch area that nothing can be executed from.
mount-noexec /tmp
mount-nosuid /tmp
mount-nodev  /tmp

# ── Landlock: the binary allow-list ──
landlock on

# Read-only system paths.  These carry READ_FILE and READ_DIR — and, on a
# directory, EXECUTE on every file beneath it, which is exactly what an
# allow-list must not hand out.  So only directories the rootdir keeps no
# executables in are left as `ro`, and the ones that do hold executables are
# granted `rw` just below.  Audit this list against your own rootdir; /etc
# in particular collects executables on a full distribution image.
ro /etc
ro /proc
ro /run

# Libraries and read-only data.  `rw` looks like the wrong word here and is
# the right one: `rw` is READ + WRITE and carries NO execute right, while
# `ro` on these directories would grant EXECUTE on every binary beneath them
# — /usr/lib/klibc/bin/true and whatever else the distribution left there —
# and the allow-list would be over before it started.  ld.so opens a .so
# read-only and Landlock has no mmap hook, so read is all a shared library
# needs; see HOWTO.md, fact 2.  A read-without-execute rule is the rule this
# wants and is not implemented yet.
#
# The `mount-ro` lines are what make the write right inert, and
# `rootdir-flags ... ro` above is NOT enough on its own.  That directive is
# applied non-recursively on purpose — /proc, /dev and /sys are separate
# mounts on top of the container root and have to stay usable — so it
# covers only what belongs to the rootdir mount itself.  A submount
# anywhere under one of the directories below would stay writable, and the
# `rw` rule would then be a real write grant.  `mount-ro PATH` self-binds
# the path and remounts it read-only through mount_setattr(2) with
# AT_RECURSIVE where the kernel has it (Linux 5.12+), which takes the
# submounts with it; without it the remount covers the top mount only.
rw /usr/lib
rw /usr/share
rw /lib64?

mount-ro /usr/lib
mount-ro /usr/share
# `mount-*` takes no trailing `?`: a path it names that does not exist is a
# fatal error, unlike a Landlock rule.  /lib64 is granted optionally above
# because not every rootdir has one; name it here only if yours does.
# mount-ro /lib64

# The executables, one rule per file.  A rule on a regular file carries only
# the file-level rights, so this is a genuine per-binary grant.
#
# The dynamic loader has to be listed: execve() opens the ELF interpreter
# with FMODE_EXEC and Landlock checks EXECUTE on it.  Shared libraries do
# NOT need it — ld.so opens them read-only — which is why `rw /usr/lib`
# above is enough for libc and friends.
#
# Listing it is also what makes this allow-list a hardening layer rather
# than an exec-target boundary: `ld-linux-x86-64.so.2 <a compatible
# loadable ELF>` runs that ELF with no execute check on it.  See the box in
# the header.
exec /lib64/ld-linux-x86-64.so.2?
exec /usr/bin/exampled
exec /usr/bin/psql
exec /usr/bin/cat

# Writable state.  W^X: read and write, no execute.
#
# `rootdir-flags ... ro` covers everything in the rootdir filesystem that is
# not a mount of its own, so /srv/exampled/data has to BE one — a volume
# bind-mounted in by whatever starts the container — or the service cannot
# write it either.  /tmp has a mount of its own because `mount-noexec /tmp`
# gave it one, and the device nodes live on the /dev tmpfs.
rw /srv/exampled/data
rw /tmp
rw /dev/null
rw /dev/zero
rw /dev/urandom
rw /dev/random
rw /dev/log?

# ── Landlock: the network ──
# TCP only.  `net-default deny` handles both bind and connect, so with only
# a connect rule below, every bind() fails too — including the explicit
# bind(port 0) some clients do before connecting.  Add `net-bind 0` if the
# service needs one.
net-connect 5432
net-default deny

# ── Capabilities ──
# Everything is dropped from the bounding set unless named here.  A service
# that binds a privileged port would add `cap-allow CAP_NET_BIND_SERVICE`.

# ── Syscalls ──
# The built-in deny-list (43 syscalls: ptrace, the mount and namespace API,
# module loading, the keyring, bpf, io_uring, ...) is installed when no
# `allow`/`block` line appears.  For a tighter policy, start from
# examples/container.conf's allow-list.
seccomp on
seccomp-default errno
# `seccomp-default kill` turns a denied syscall into SIGSYS instead of
# EPERM.  That is the safer default for anything that does not check return
# values, at the cost of a hard crash where the program might have coped.

# ── Environment ──
env-deny LD_*
env-deny GLIBC_TUNABLES
env-deny GCONV_PATH
env-deny PGPASSWORD

# ── Features ──
no-new-privs on
env-sanitize on
