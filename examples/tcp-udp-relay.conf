#
# tcp-udp-relay.conf — sandbox profile for general TCP/UDP relay tools
#
# Tools: socat, nc, ncat, netcat (GNU + OpenBSD variants)
#
# Validated on: Ubuntu 22.04.5 LTS (Jammy), kernel 5.15.0-173-generic,
#               Landlock ABI v1, both root and unprivileged user.
#               Tested with socat 1.7.4.1 and nc.openbsd 1.218. Profile
#               syntax is portable across all Landlock-capable kernels
#               (>= 5.13).
#
# Distinct from socat-proxy.conf (which is the SSH-bridge case used by
# paranoid-ssh.sh — that one denies $HOME entirely). This profile is
# for general-purpose port-forward / one-shot relay use:
#
#   compartment-user --profile examples/tcp-udp-relay.conf -- \
#       socat TCP-LISTEN:8080,reuseaddr TCP:backend.internal:80
#
#   compartment-user --profile examples/tcp-udp-relay.conf -- \
#       nc -l -p 9000 < /tmp/payload.bin
#
#   compartment-user --profile examples/tcp-udp-relay.conf -- \
#       ncat --ssl example.com 443
#
# Works as both root (privileged ports < 1024) and as a regular user
# (unprivileged ports). No raw sockets needed.
#
# What this DOES prevent:
#   - Compromised relay reading $HOME secrets, /root, /etc/shadow*,
#     /var/log, anywhere except /tmp
#   - Writing log/state/spooled files outside /tmp
#   - socat EXEC: spawning shells that escape the sandbox (no-new-privs
#     blocks setuid; seccomp blocks ptrace, so debugger injection fails)
#   - Loading kernel modules, eBPF abuse, kexec, mounting filesystems
#
# What this does NOT prevent:
#   - Network egress (it's a relay — by definition it makes connections).
#     If you want to limit destinations, use compartment-root --no-network
#     and an outbound proxy, or run inside a netns with restricted egress.
#   - Reading files in /etc (Landlock ABI v1 limitation).
#
# *unless you also pass --no-landlock — don't.

# ── Filesystem ──
ro /usr
ro /lib
ro /lib64
ro /bin
ro /sbin
ro /etc
ro /proc
ro /sys
ro /run
ro /dev

# /tmp writable for socat unix sockets (UNIX-LISTEN:/tmp/sock) and for
# small stdin/stdout file payloads. NOT $HOME.
rw /tmp

# ── Syscalls ──
block ptrace
block mount
block umount2
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block unshare
block setns
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd
block ioperm
block iopl

# ── Environment ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH
# socat/nc don't read ~/.netrc, but block injection vars anyway:
env-deny BASH_ENV
env-deny ENV
env-deny SOCAT_DEFAULT_LISTEN_IP

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
