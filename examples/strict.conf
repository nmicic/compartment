# strict.conf — locked-down profile
#
# Inherits ai-agent defaults, adds extra syscall blocks.
# For high-security environments where you want minimal attack surface.

inherit ai-agent

block personality
block lookup_dcookie
block vhangup
block quotactl
block mbind
block move_pages
