# dev.conf — relaxed profile for development/testing
#
# Filesystem restrictions with minimal syscall blocks.
# Good for debugging when the default profile is too strict.

ro /usr
ro /lib
ro /lib64
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev
ro /sys
ro /run

rw /tmp
rw $HOME

# Only block the most dangerous syscalls
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block reboot

env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH

landlock on
seccomp on
no-new-privs on
env-sanitize on

# Verbose for debugging
# audit on
