# ssh.conf — Compartment profile for hardened SSH client
#
# Goal: prevent a compromised SSH client from writing credentials,
# session logs, or any data to disk. The SSH process gets read-only
# access to everything it needs and nothing more.
#
# Usage:
#   compartment-user --profile examples/ssh.conf -- ssh -l user host
#
# What this prevents:
#   - Compromised SSH writing stolen credentials to ~/.ssh/exfil.txt
#   - Malicious SSH logging keystrokes/session to a hidden file
#   - SSH binary modified to phone home via filesystem side-channels

# ── Filesystem: read-only except devices (SSH needs PTYs) ──
ro /usr
ro /lib
ro /lib64
ro /etc
ro /run
rw /dev
ro /proc
ro /sys
ro $HOME/.ssh
ro /usr/lib/locale
ro /usr/lib/ssl
# /tmp needed for SSH ControlMaster sockets if used
ro /tmp

# ── Syscalls: block dangerous operations ──
block ptrace
block mount
block umount2
block pivot_root
block chroot
block unshare
block setns
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd

# ── Environment: strip injection vectors ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
