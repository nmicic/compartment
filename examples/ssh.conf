# ssh.conf — Compartment profile for hardened SSH client
#
# Goal: prevent a compromised SSH client from writing credentials,
# session logs, or any data to disk. The SSH process gets read-only
# access to everything it needs, plus exactly one writable file: the
# known-hosts file used for host-key verification.
#
# Usage:
#   compartment-user --profile examples/ssh.conf -- ssh -l user host
#
# Designed for examples/paranoid-ssh.sh, which supplies the matching
# -o UserKnownHostsFile= and -o HostKeyAlias= options.
#
# What this prevents:
#   - Compromised SSH writing stolen credentials to ~/.ssh/exfil.txt
#   - Malicious SSH logging keystrokes/session to a hidden file
#   - SSH binary modified to phone home via filesystem side-channels

# ── Filesystem: read-only, with a short list of writable devices ──
ro /usr
ro /lib
ro /lib64
ro /etc
ro /run
ro /proc
ro /sys
ro $HOME/.ssh
ro /usr/lib/locale
ro /usr/lib/ssl
ro /tmp

# Devices: ssh needs /dev/null and the controlling terminal.
#
# This wants to be "rw /dev/null" and nothing more, but compartment-user
# cannot express a per-file rule: it asks Landlock for READ_DIR on every
# path, the kernel rejects directory rights on a non-directory with EINVAL,
# and landlock_add_path() discards EINVAL — so a rule naming a file installs
# nothing at all and ssh dies with "Couldn't open /dev/null".  Until rules on
# files work, the whole of /dev is the narrowest thing that is honoured.
rw /dev

# Host-key verification needs somewhere to record a first-use key.  This is
# the ONE writable directory in $HOME; everything else under ~/.ssh stays
# read-only, so a compromised client cannot rewrite your keys or your config.
# paranoid-ssh.sh creates it (mode 700) — a Landlock rule for a path that
# does not exist installs nothing.
rw $HOME/.ssh/paranoid

# NOT supported under this profile:
#   ControlMaster sockets — creating one needs write access to /tmp (or
#   wherever ControlPath points), which would defeat the "cannot write to
#   disk" goal.  paranoid-ssh.sh passes -o ControlMaster=no.

# ── Syscalls: block dangerous operations ──
block ptrace
block mount
block umount2
block pivot_root
block chroot
block unshare
block setns
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd

# ── Environment: strip injection vectors ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
