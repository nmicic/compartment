#
# curl-wget.conf — sandbox profile for HTTP(S) clients
#
# Tools: curl, wget, aria2c
#
# Validated on: Ubuntu 22.04.5 LTS (Jammy), kernel 5.15.0-173-generic,
#               Landlock ABI v1, both root and unprivileged user.
#               Profile syntax is portable across all Landlock-capable
#               kernels (>= 5.13); on ABI v2+ the per-file `ro /etc/*`
#               alternative below becomes effective.
# Downloads MUST land in /tmp; nowhere else is writable.
#
# Usage:
#   compartment-user --profile examples/curl-wget.conf -- \
#       curl -fLo /tmp/release.tgz https://example.com/release.tgz
#
#   compartment-user --profile examples/curl-wget.conf -- \
#       wget -O /tmp/index.html https://example.com/
#
# What this DOES prevent:
#   - Exfiltration of ~/.aws/credentials, ~/.ssh/id_rsa, ~/.netrc,
#     ~/.docker/config.json, GitHub/Gitlab tokens, etc. ($HOME is NOT
#     mapped, so those files can't be opened.)
#   - Downloads landing outside /tmp (e.g. ~/.bashrc overwrite via -O)
#   - Writes to /root, /var/log, /etc, or anywhere except /tmp
#   - Loading kernel modules, eBPF abuse, ptrace, kexec
#
# What this does NOT prevent on Landlock ABI v1 (kernel < 5.19):
#   - Reading files inside /etc itself (/etc/shadow, /etc/sudoers,
#     /etc/ssh/ssh_host_*_key). curl needs /etc for TLS/DNS, so we grant
#     the whole directory. A compromised curl could read /etc/shadow and
#     POST it — because its whole job is network, seccomp cannot block
#     that.
#   - If your threat model cares about this: run on kernel >= 5.19 and
#     uncomment the per-file grants below; or combine with compartment-
#     root running curl as an unprivileged user so /etc/shadow is not
#     DAC-readable anyway.
#
# NOTE: $HOME is NOT mapped, so curl will NOT pick up ~/.curlrc, and
# wget will NOT pick up ~/.wgetrc or ~/.netrc. Pass auth on the
# command line (--user, --header) or via a file under /tmp instead.
# This is intentional — the profile defends against credential theft.

# ── Filesystem ──
ro /usr
ro /lib
ro /lib64
ro /bin
ro /sbin
ro /etc
ro /proc
ro /sys
ro /run
ro /dev

# Downloads only here.
rw /tmp

# NOTE: explicitly NOT granting $HOME, $HOME/.aws, $HOME/.ssh, /root.
# This is the cornerstone of the profile — a compromised curl cannot
# read ~/.ssh/id_rsa or ~/.aws/credentials and exfiltrate them.
#
# If you want downloads to land in ~/Downloads (or ~/tmp) instead of
# /tmp, you have three choices:
#   1. Per-invocation:
#        compartment-user --profile examples/curl-wget.conf \
#                         --rw $HOME/Downloads -- curl ...
#   2. Copy this profile and add `rw $HOME/Downloads` (Landlock will
#      silently skip the rule if the directory doesn't exist, so it's
#      safe to leave in even if not all users have it).
#   3. Use a per-user profile in ~/.config/compartment/curl.conf with
#      `inherit curl-wget` plus your own `rw` line.

# Per-file alternative for /etc (uncomment + remove `ro /etc` above; needs
# kernel >= 5.19 / Landlock ABI v2):
#   ro /etc/ld.so.cache
#   ro /etc/ld.so.conf
#   ro /etc/ld.so.conf.d
#   ro /etc/gai.conf
#   ro /etc/host.conf
#   ro /etc/hosts
#   ro /etc/nsswitch.conf
#   ro /etc/passwd
#   ro /etc/resolv.conf
#   ro /etc/localtime
#   ro /etc/protocols
#   ro /etc/services
#   ro /etc/ssl/certs
#   ro /etc/ssl/openssl.cnf
#   ro /etc/ca-certificates
#   ro /etc/ca-certificates.conf

# ── Syscalls ──
block ptrace
block mount
block umount2
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block unshare
block setns
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd
block ioperm
block iopl

# ── Environment ──
# Block dynamic-loader injection.
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH

# Block credential variables that curl/wget might forward into headers
# or logs if exploited.
env-deny AWS_ACCESS_KEY_ID
env-deny AWS_SECRET_ACCESS_KEY
env-deny AWS_SESSION_TOKEN
env-deny GOOGLE_APPLICATION_CREDENTIALS
env-deny AZURE_CLIENT_SECRET
env-deny GITHUB_TOKEN
env-deny GH_TOKEN
env-deny GITLAB_TOKEN
env-deny NPM_TOKEN

# Block proxy-override env that could redirect traffic.
# (If you intentionally need a proxy, comment these out.)
env-deny http_proxy
env-deny https_proxy
env-deny HTTP_PROXY
env-deny HTTPS_PROXY
env-deny ALL_PROXY
env-deny all_proxy

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
