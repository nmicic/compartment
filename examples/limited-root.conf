#
# limited-root.conf — a uid-0 login that can administer a host but cannot
#                     switch its own confinement off
#
# LIMITS: the complete list of what this deployment does NOT protect against
# is HOWTO.md, "Limited root over SSH", section 8.  Read it before deploying.
#
# Install as /etc/compartment/shell-replacement.conf (root:root 0644), or
# install here as /etc/compartment/limited-root.conf and point
# shell-replacement.conf at it with a one-line `inherit limited-root`.
# compartment-user reads shell-replacement.conf when it is invoked under a
# shell's name, which is what an account whose login shell is the wrapper
# does.  See HOWTO.md, "Limited root over SSH".
#
# This file is the userspace half.  The kernel half is
# compartment-bpf/profiles/limited-root-authpath.conf, and the two answer
# different adversaries:
#
#   * THIS FILE binds the confined session.  It is per-task kernel state —
#     Landlock domain, seccomp filter, capability bounding set, mount
#     namespace — that the session inherits and can only narrow.  It says
#     nothing about any process outside the session.
#   * THE SEAL PROFILE binds the inode.  It is what stops a root process
#     that is NOT in the session — cron, a unit, an sshd session for an
#     account whose shell is not the wrapper — from editing the login path
#     out from under it.  Landlock protects only the side it is on.
#
# Deploy both.  Either one alone leaves the other adversary unanswered.
#
# ── What this DOES guarantee, for the confined session ────────────────
#
#   * The four mechanisms cannot be removed.  There is no API to release a
#     Landlock domain, drop a seccomp filter, clear no_new_privs or re-add
#     a bounding-set capability, and all four survive fork and execve.
#     Running `compartment-user --no-landlock --no-seccomp` from inside the
#     session widens nothing: a second ruleset intersects, a second filter
#     is ANDed.
#   * No module load, kexec, reboot, raw block-device write, kernel-memory
#     access, security-sysctl change, ptrace, perf, bpf, userfaultfd or
#     io_uring.
#   * No namespace escape: setns, unshare, pivot_root and chroot are all
#     denied twice over, by capability and by syscall.
#   * No write anywhere in the authentication or login path, and no
#     hardlink or rename around it — a `ro` rule carries no REFER right, so
#     `ln /etc/shadow <writable>` fails EXDEV.
#   * No talking to systemd, D-Bus or snapd, which is the only reason the
#     `mask` lines below exist.
#
# ── What this does NOT guarantee ──────────────────────────────────────
#
#   * The mask list is an enumeration, not a boundary.  Landlock has no
#     access right covering connect(2) to a pathname unix socket, so every
#     privileged socket has to be named here one at a time.  A distribution
#     that adds one adds a hole.  Check `find /run -type s` after an
#     upgrade.
#   * sshd is outside the session and will act on the account's behalf:
#     `ssh -L /tmp/s:/run/systemd/private` makes *sshd* perform the connect
#     this file denies.  That needs sshd_config, not policy — see the
#     `Match User` block in HOWTO.md — and the sshd_config seal so it
#     cannot be put back.
#   * `internal-sftp` runs inside the sshd child and never execs a shell,
#     so it bypasses this file completely.  Keep the external
#     `Subsystem sftp /usr/lib/openssh/sftp-server`.
#   * Below Landlock ABI v6 (Linux < 6.12) there are no scoped rules, so
#     the account can still signal processes outside its domain.  That is a
#     denial-of-service surface, not an escape — unless compartment-bpf is
#     running as a daemon, which is why the seal profile must be pinned
#     with --pin and not left to a daemon that can be killed.
#   * uid 0 is uid 0.  Nothing here creates a uid boundary; the Landlock
#     allow-list is the only thing between the account and the filesystem,
#     and DAC contributes nothing.
#   * An fd received over SCM_RIGHTS from an unconfined process is not
#     re-checked by Landlock.
#
# ┌───────────────────────────────────────────────────────────────────┐
# │ IF YOU TIGHTEN THIS INTO AN EXEC ALLOW-LIST, READ THIS FIRST.     │
# │                                                                   │
# │ This profile is deliberately NOT a binary allow-list. It grants   │
# │ `ro` on /usr, /bin, /sbin and friends, and `ro` on a directory    │
# │ grants EXECUTE on everything beneath it, so the account can run   │
# │ any system binary by design — it is meant to administer a host.   │
# │                                                                   │
# │ The obvious way to tighten it is to replace those `ro` rules with │
# │ per-file `exec` rules. That buys less than it looks like it does. │
# │ Any dynamically linked allow-list must also list the loader, and  │
# │ a listed loader can be invoked as a program in its own right:     │
# │                                                                   │
# │     /lib64/ld-linux-x86-64.so.2 <a compatible loadable ELF>       │
# │                                                                   │
# │ runs that ELF with no `execve(2)` of it and so no execute check   │
# │ on it. `rw` grants read, and this profile grants `rw $HOME`, `rw  │
# │ /tmp` and `rw /var/tmp` — three places the session can write an   │
# │ ELF and then start it. An exec allow-list here would be a         │
# │ hardening layer, not an exec-target boundary.                     │
# │                                                                   │
# │ To close the direct-loader bypass: static-link the allowed        │
# │ binaries and do not list the loader, or grant no location that is │
# │ both readable and writable and leave no readable unlisted ELF. A  │
# │ `noexec` mount over the writable areas closes the                 │
# │ writable-payload half of the bypass and only that half; a         │
# │ readable unlisted ELF elsewhere is untouched by it.               │
# │                                                                   │
# │ Even with the bypass closed you get an exec-target boundary and   │
# │ not a code-execution boundary: an allowed program that is         │
# │ compromised can still interpret, JIT, dlopen or otherwise map     │
# │ code of its own choosing, and Landlock hooks `open`, not `mmap`.  │
# │                                                                   │
# │ A kernel-side exec confinement that does not need the loader      │
# │ listed is designed and not shipped. Full statement: HOWTO.md,     │
# │ "`exec` on a file: a binary allow-list", fact 5.                  │
# └───────────────────────────────────────────────────────────────────┘
#
# ── Filesystem ────────────────────────────────────────────────────────
#
# Read-only system paths.  NOTE the two that are deliberately absent:
#
#   * there is no `ro /dev`.  It would grant READ_FILE on the raw disk
#     node, which is every shadow hash in one `dd`.  Device *files* are
#     named individually below.
#   * there is no `ro /sys` either, because a blanket rule would cover
#     /sys/fs/bpf and hand the seal pin tree to the session.  bpffs is an
#     ordinary Landlock subject: with no rule the pin tree is EACCES.

ro /usr
ro /bin
ro /sbin
ro /lib
ro /lib64
ro /lib32?
ro /etc
ro /opt?
ro /srv?

# /proc is required — ps, top, ss and every /proc/<pid> tool need it — and
# it is read-only, which is what makes /proc/sys/kernel/core_pattern,
# /proc/sys/kernel/modprobe and /proc/sysrq-trigger unwritable.  The one
# thing `ro` does not solve is /proc/kcore, which is readable under a read
# rule; that is handled by a mask below.
ro /proc

# Logs and journal.  Read-only: an administrator reads the trail, they do
# not rewrite it.
ro /var/log
ro /run/systemd/journal?

# The narrow /sys rules an admin actually uses.  Named individually so
# that /sys/fs/bpf, /sys/kernel/debug and /sys/kernel/tracing stay
# uncovered.
ro /sys/class
ro /sys/devices
ro /sys/block?

# Device files, one at a time.
rw /dev/null
rw /dev/zero
rw /dev/full
rw /dev/tty
rw /dev/ptmx
rw /dev/pts
ro /dev/urandom
ro /dev/random

# Writable working space.  Every `rw` rule also carries MAKE_BLOCK and
# MAKE_CHAR — Landlock has no way to withhold them — so CAP_MKNOD and the
# mknod/mknodat blocks below are what stop a device node being re-created
# inside one of these.
rw /tmp
rw /var/tmp
rw $HOME

# Named administrative writables.  Replace with the paths this operator's
# limited root is actually supposed to manage; the point of the account is
# that the list is short and explicit.
rw /srv/admin?
rw /var/lib/misc?

# ── Capabilities ──────────────────────────────────────────────────────
#
# What survives an execve for a uid-0 process is exactly the bounding set,
# so this list is the capability policy for the whole session.  Verify with
#   grep CapBnd /proc/self/status
# after logging in.  SECBIT_NOROOT is NOT set: the account keeps
# CAP_DAC_OVERRIDE, CAP_CHOWN, CAP_FOWNER, CAP_KILL, CAP_SETUID/SETGID,
# CAP_NET_ADMIN, CAP_NET_RAW and CAP_SYSLOG, or it cannot read a log, run
# `ip`, or manage a file.  That is the trade-off this profile makes on
# purpose; see HOWTO.md for the version that does not.

cap-drop CAP_SYS_MODULE        # modprobe, init_module, finit_module
cap-drop CAP_SYS_BOOT          # reboot(2), kexec_load
cap-drop CAP_SYS_RAWIO         # /dev/mem, ioperm, hdparm
cap-drop CAP_BPF               # bpf(2) — the seals live behind this one
cap-drop CAP_PERFMON           # perf_event_open, bpftool
cap-drop CAP_SYS_PTRACE        # gdb, /proc/<other>/mem, pidfd_getfd
cap-drop CAP_MAC_ADMIN         # AppArmor/SELinux policy
cap-drop CAP_MAC_OVERRIDE      # label bypass
cap-drop CAP_LINUX_IMMUTABLE   # chattr +i / -i / +a
cap-drop CAP_MKNOD             # device-node re-creation inside a rw rule
cap-drop CAP_SYS_RESOURCE      # PR_SET_MM_EXE_FILE forges the seal actor
cap-drop CAP_SYS_CHROOT        # chroot(2)
cap-drop CAP_DAC_READ_SEARCH   # open_by_handle_at; DAC_OVERRIDE still reads
cap-drop CAP_SYS_TIME          # clock changes are a log-forging primitive
cap-drop CAP_AUDIT_CONTROL     # muting the audit subsystem

# CAP_SYS_ADMIN is the expensive one.  Dropping it costs mount, umount,
# setns, unshare, pivot_root, swapon, quotactl and nsenter — and with them
# compartment-root, sandbox.sh HARD mode, and this project's own root test
# suite, none of which a limited root can run.  The wrapper needs the
# capability while it builds the mount namespace above and drops it
# immediately afterwards, so the masks still get made.  Comment this line
# out only if the account's job is running containers, and read c1/c2/c6 in
# the design notes first: they reopen together.
cap-drop CAP_SYS_ADMIN

# CAP_SETPCAP is deliberately kept.  Dropping it stops nothing — the
# bounding set is already down and cannot be raised — and it breaks capsh.

# ── Mount masks ───────────────────────────────────────────────────────
#
# Everything here is a path Landlock cannot take away.  The first two are
# the reason this directive exists: a domain that denies open() on
# /run/systemd/private still lets a process connect() to it, so
# `systemd-run` works fine under a Landlock policy that names no /run rule
# at all.  Masked, both systemctl and systemd-run report
# "Failed to connect to bus: Connection refused".
#
# Do NOT also seal a path that is masked: compartment-bpf refuses a new
# mount on or under a sealed path, so seal-plus-mask fails the mask and,
# because masks fail closed, fails the login.  /boot is sealed and NOT
# masked for exactly this reason; it needs no mask, since no rule above
# grants it.

mask /run/systemd/private
mask /run/dbus/system_bus_socket

# systemd >= 257 exposes a varlink interface to PID 1 alongside the private
# socket.  Optional because it does not exist on older systemd.
mask /run/systemd/io.systemd.Manager?

# snapd installs and runs hooks as unconfined root.  Optional only because
# the daemon is not everywhere; where it exists this is not optional in any
# meaningful sense.
mask /run/snapd.socket?
mask /run/snapd-snap.socket?

# udevadm control --reload / --exit
mask /run/udev/control?

# The one file `ro /proc` cannot protect: a read rule grants READ_FILE on
# /proc/kcore, and /proc has to be readable for ps and ss to work.
mask /proc/kcore

# /proc/sysrq-trigger is deliberately NOT masked.  `ro /proc` already
# refuses the open with EACCES, and a mask would be strictly worse: a
# non-directory mask is a /dev/null bind, so the write would be accepted
# and discarded rather than refused.  Masks are for read and connect
# surfaces; Landlock is for write surfaces.

# Belt and braces for the read side: no rule above grants these, so
# Landlock already refuses them, and on a kernel booted with
# lockdown=integrity /dev/mem is refused by the kernel as well.  Kept
# because neither of those is true on every host, and a mask turns a
# kernel-memory read into an EOF even where a policy is looser than this
# one.
mask /dev/mem?
mask /dev/kmem?
mask /dev/port?
mask /sys/kernel/debug?
mask /sys/kernel/tracing?

# ── Syscalls ──────────────────────────────────────────────────────────
#
# The built-in deny-list already carries ptrace, process_vm_readv/writev,
# the mount and namespace family, open_by_handle_at, name_to_handle_at,
# reboot, kexec_load, kexec_file_load, init_module, finit_module,
# delete_module, the keyring calls, bpf, userfaultfd, perf_event_open, the
# three io_uring calls, acct, swapon/swapoff, the clock setters,
# pidfd_getfd and (x86_64) ioperm/iopl.  This profile does not inherit it,
# so the entries that matter are named here in full rather than assumed.

block ptrace
block process_vm_readv
block process_vm_writev
block mount
block umount2
block pivot_root
block chroot
block unshare
block setns
block mount_setattr
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block open_by_handle_at
block name_to_handle_at
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block io_uring_setup
block io_uring_enter
block io_uring_register
block acct
block swapon
block swapoff
block settimeofday
block clock_settime
block clock_adjtime
block adjtimex
block pidfd_getfd
block ioperm
block iopl

# Added by this profile on top of the built-in set.  mknodat is the one
# that does the work: glibc's mknod(3) issues mknodat(2), so blocking
# `mknod` alone stops nothing, and a `rw` rule grants MAKE_BLOCK.
block mknod
block mknodat
block quotactl

# A denied syscall returns EPERM.  `seccomp-default kill` is the stricter
# reading — a program that ignores the return value corrupts its own logic
# instead of dying — but it turns a mistyped policy into a killed login
# shell, so it is left at the default here and named as the knob it is.
# seccomp-default kill

# ── Environment ───────────────────────────────────────────────────────

env-deny LD_*
env-deny DYLD_*
env-deny GLIBC_TUNABLES
env-deny BASH_ENV
env-deny ENV
env-deny BASH_FUNC_*
env-deny PROMPT_COMMAND
env-deny PERL5*
env-deny PYTHON*
env-deny GIT_SSH_COMMAND
env-deny GIT_CONFIG_*
env-deny COMPARTMENT_SHELL_DIR

# ── Features ──────────────────────────────────────────────────────────

landlock on
seccomp on
no-new-privs on
env-sanitize on

# The audit log has to live outside every path granted above, or the
# session can rewrite its own trail.  Nothing here grants /var/log/
# compartment for writing, and `ro /var/log` makes it readable but not
# writable, which is what integrity needs.
audit on
audit-log /var/log/compartment
