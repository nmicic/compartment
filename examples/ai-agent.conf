# ai-agent.conf — sandbox profile for AI CLI agents
#
# Use with: compartment-user --profile ai-agent -- <agent>
#
# This file is byte-for-byte the policy compartment-user compiles in as
# its default, with $HOME left unexpanded. Regenerate it with:
#
#     compartment-user --dump-profile ai-agent
#
# Installing it under /etc/compartment/ai-agent.conf (root-owned, mode
# 0644) overrides the built-in for every user on the host. Installing it
# under ~/.config/compartment/ai-agent.conf only takes effect when
# compartment-user is run with --user-profiles.

# ── Filesystem (Landlock) ──
ro /usr
ro /lib
ro /lib64
ro /lib32?
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev
ro /sys
ro /run
ro /var/lib
rw /tmp
rw /dev/null
rw /dev/zero
rw /dev/random
rw /dev/urandom
rw /dev/tty
rw /dev/pts
rw /dev/ptmx
rwx $HOME

# Syscall deny-list (seccomp)
block ptrace
block process_vm_readv
block process_vm_writev
block mount
block umount2
block pivot_root
block chroot
block unshare
block setns
block mount_setattr
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block open_by_handle_at
block name_to_handle_at
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block io_uring_setup
block io_uring_enter
block io_uring_register
block acct
block swapon
block swapoff
block settimeofday
block clock_settime
block clock_adjtime
block adjtimex
block pidfd_getfd
block ioperm
block iopl

# Environment deny-list ('*' suffix = prefix match)
env-deny LD_*
env-deny GLIBC_TUNABLES
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH
env-deny DYLD_*
env-deny _JAVA_OPTIONS
env-deny JAVA_TOOL_OPTIONS
env-deny AWS_ACCESS_KEY_ID
env-deny AWS_SECRET_ACCESS_KEY
env-deny AWS_SESSION_TOKEN
env-deny GOOGLE_APPLICATION_CREDENTIALS
env-deny AZURE_CLIENT_SECRET
env-deny GITHUB_TOKEN
env-deny GH_TOKEN
env-deny GITLAB_TOKEN
env-deny NPM_TOKEN
env-deny BASH_ENV
env-deny ENV
env-deny BASH_FUNC_*
env-deny PROMPT_COMMAND
env-deny IFS
env-deny ZDOTDIR
env-deny CDPATH
env-deny GLOBIGNORE
env-deny NODE_OPTIONS
env-deny PYTHON*
env-deny PERL5*
env-deny PERLLIB
env-deny RUBYOPT
env-deny RUBYLIB
env-deny GIT_SSH_COMMAND
env-deny GIT_CONFIG_*
env-deny GIT_EDITOR
env-deny GIT_EXEC_PATH
env-deny GIT_TEMPLATE_DIR
env-deny PAGER
env-deny MANPAGER
env-deny EDITOR
env-deny VISUAL
env-deny SSH_AUTH_SOCK
env-deny DATABASE_URL
env-deny PGPASSWORD
env-deny MYSQL_PWD

# Features (a profile may only turn these on)
landlock on
seccomp on
no-new-privs on
env-sanitize on
