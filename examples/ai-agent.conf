# ai-agent.conf — sandbox profile for AI CLI agents
#
# Use with: compartment-user --profile ai-agent -- claude
# Or place at: ~/.config/compartment/ai-agent.conf
#
# This is the built-in default. Create this file to override it.

# ── Filesystem (Landlock) ──
ro /usr
ro /lib
ro /lib64
ro /lib32
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev
ro /sys
ro /run
ro /var/lib

rw /tmp
rw $HOME

# ── Syscall blocklist (seccomp) ──
block ptrace
block mount
block umount2
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block unshare
block setns
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block acct
block swapon
block swapoff
block settimeofday
block clock_settime
block clock_adjtime
block adjtimex
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd
block ioperm
block iopl

# ── Environment ──
# Dynamic linker injection
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH
env-deny DYLD_INSERT_LIBRARIES
env-deny DYLD_LIBRARY_PATH
env-deny _JAVA_OPTIONS
env-deny JAVA_TOOL_OPTIONS
# Cloud credentials
env-deny AWS_ACCESS_KEY_ID
env-deny AWS_SECRET_ACCESS_KEY
env-deny AWS_SESSION_TOKEN
env-deny GOOGLE_APPLICATION_CREDENTIALS
env-deny AZURE_CLIENT_SECRET
# Interpreter startup injection
env-deny BASH_ENV
env-deny ENV
env-deny NODE_OPTIONS
env-deny PYTHONSTARTUP
env-deny PERL5OPT
env-deny PERL5LIB
env-deny RUBYOPT
env-deny RUBYLIB
env-deny CDPATH
env-deny GLOBIGNORE
# VCS / CI tokens
env-deny GITHUB_TOKEN
env-deny GH_TOKEN
env-deny GITLAB_TOKEN
env-deny NPM_TOKEN
# SSH agent
env-deny SSH_AUTH_SOCK
# Database credentials
env-deny DATABASE_URL
env-deny PGPASSWORD
env-deny MYSQL_PWD

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
