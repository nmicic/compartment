#
# dns-client.conf — sandbox profile for DNS client tools
#
# Tools: dig, nslookup, host, drill, kdig, mdig, delv
#
# Validated on: Ubuntu 22.04.5 LTS (Jammy), kernel 5.15.0-173-generic,
#               Landlock ABI v1, both root and unprivileged user.
#               Tested with bind9-dnsutils (dig 9.18.x). Profile syntax
#               is portable across all Landlock-capable kernels (>= 5.13).
#
# Pure read-only profile — DNS clients only need to send UDP/TCP queries
# and print to stdout. They don't need raw sockets and don't need to
# write anything to disk. Works equally well as root or as a regular user.
#
# Usage:
#   compartment-user --profile examples/dns-client.conf -- \
#       dig +short example.com
#
#   compartment-user --profile examples/dns-client.conf -- \
#       nslookup example.com 8.8.8.8
#
#   compartment-user --profile examples/dns-client.conf -- \
#       host -t MX example.com
#
# What this DOES prevent:
#   - Any disk write — no /etc/resolv.conf overwrite, no log/state files
#   - Reading $HOME secrets, /root, /var, anything outside the system tree
#   - dig writing query history or saving cookies anywhere
#   - Loading kernel modules, eBPF abuse, ptrace, kexec
#
# What this does NOT prevent:
#   - DNS exfiltration via crafted query names (the tool's whole job is
#     to send DNS queries). If that matters: combine with compartment-root
#     --no-network and a constrained resolver, or block port 53 egress
#     except to your designated resolver via netfilter.

# ── Filesystem (read-only everywhere) ──
ro /usr
ro /lib
ro /lib64
ro /bin
ro /sbin
ro /etc
ro /proc
ro /sys
ro /run
ro /dev

# Deliberately NO writable paths.

# ── Syscalls ──
block ptrace
block mount
block umount2
block reboot
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block unshare
block setns
block keyctl
block add_key
block request_key
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev
block io_uring_setup
block io_uring_enter
block io_uring_register
block open_by_handle_at
block name_to_handle_at
block open_tree
block move_mount
block fsopen
block fsmount
block fsconfig
block fspick
block mount_setattr
block pidfd_getfd
block ioperm
block iopl

# ── Environment ──
env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny GCONV_PATH
env-deny HOSTALIASES
env-deny LOCPATH
env-deny NLSPATH
env-deny RES_OPTIONS
env-deny LOCALDOMAIN

# ── Features ──
landlock on
seccomp on
no-new-privs on
env-sanitize on
