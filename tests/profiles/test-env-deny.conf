# test-env-deny.conf — environment deny-list
#
# Strips specific dangerous vars, keeps everything else
#
# Landlock and seccomp are deliberately unrestrictive (this profile
# isolates environment sanitization). A profile may no longer switch a
# mechanism off, so Landlock grants the whole tree read+execute and /tmp
# read-write instead — the probe binary may live anywhere in the work
# tree — and the seccomp deny-list is simply empty.

env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT
env-deny SECRET_TOKEN

ro /
rw /tmp

landlock on
seccomp on
no-new-privs on
env-sanitize on
