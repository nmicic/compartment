# test-fs-rw.conf — read-write sandbox (deny_probe can write to fixtures)
#
# Filesystem: system paths ro, fixture dir rw
# seccomp: off (isolate Landlock testing)
#
# @FIXTURES@ is substituted with the per-run fixture root by
# tests/scripts/make_fixtures.sh; the rendered copy lives in
# $FIXTURES/profiles/.

ro /usr
ro /lib
ro /lib64
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev

rwx @FIXTURES@

landlock on
seccomp off
no-new-privs on
env-sanitize off
