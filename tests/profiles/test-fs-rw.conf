# test-fs-rw.conf — read-write sandbox (deny_probe can write to fixtures)
#
# Filesystem: system paths ro, fixture dir rw
# seccomp: off (isolate Landlock testing)

ro /usr
ro /lib
ro /lib64
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev

rwx /tmp/compartment-fixtures

landlock on
no-new-privs on

# seccomp and env-sanitize stay on but have no rules, which is how this
# profile isolates Landlock: a profile may no longer switch a mechanism
# off (use the --no-seccomp / --no-env-sanitize flags for that).
seccomp on
env-sanitize on
