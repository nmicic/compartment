# test-fs-rw.conf — read-write sandbox (deny_probe can write to fixtures)
#
# Filesystem: system paths ro, fixture dir rw
# seccomp: off (isolate Landlock testing)

ro /usr
ro /lib
ro /lib64
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev

rw /tmp/compartment-fixtures

landlock on
seccomp off
no-new-privs on
env-sanitize off
