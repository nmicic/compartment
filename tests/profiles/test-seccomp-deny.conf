# test-seccomp-deny.conf — seccomp deny-list (block dangerous syscalls)
#
# Landlock: deliberately unrestrictive (isolates seccomp testing).
# A profile may no longer switch a mechanism off, so instead of
# "landlock off" this grants the whole tree read+execute and /tmp
# read-write — the probe binary may live anywhere in the work tree.
# Blocks: ptrace, unshare, process_vm_readv/writev, userfaultfd, perf_event_open, io_uring

block ptrace
block unshare
block process_vm_readv
block process_vm_writev
block userfaultfd
block perf_event_open
block io_uring_setup
block io_uring_enter
block io_uring_register

ro /
rw /tmp

landlock on
seccomp on
no-new-privs on
env-sanitize on
