# test-seccomp-deny.conf — seccomp deny-list (block dangerous syscalls)
#
# Landlock: off (isolate seccomp testing)
# Blocks: ptrace, unshare, process_vm_readv/writev, userfaultfd, perf_event_open

block ptrace
block unshare
block process_vm_readv
block process_vm_writev
block userfaultfd
block perf_event_open

landlock off
seccomp on
no-new-privs on
env-sanitize off
