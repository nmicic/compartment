# test-combined.conf — full sandbox (Landlock + seccomp + env sanitize)
#
# Realistic profile: system paths ro, fixtures rw, dangerous syscalls blocked,
# env vars stripped
#
# @FIXTURES@ is substituted with the per-run fixture root by
# tests/scripts/make_fixtures.sh; the rendered copy lives in
# $FIXTURES/profiles/.

ro /usr
ro /lib
ro /lib64
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev

rwx @FIXTURES@

block ptrace
block unshare
block process_vm_readv
block process_vm_writev
block userfaultfd
block perf_event_open
block mount
block kexec_load

env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT

landlock on
seccomp on
no-new-privs on
env-sanitize on
