# test-claude-smoke.conf — profile for running Claude CLI under compartment-user
#
# Must allow: ~/.claude/ (auth), /tmp (runtime), system paths (binaries/libs)
# Blocks dangerous syscalls but allows normal operation

ro /usr
ro /lib
ro /lib64
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev
ro /sys
ro /run
ro /var/lib
ro /snap

rw /tmp
rw $HOME

# The CLI itself.  `rw $HOME` is W^X — read and write, no execute — so a CLI
# installed under $HOME (npm -g with a user prefix, ~/.local/bin, a version
# manager) cannot be exec'd under this profile without an explicit execute
# grant.  run_claude_smoke.sh resolves the binary, follows it to its real
# path and renders @CLI_DIR@ before loading this file; the '?' keeps the
# rendered profile loadable when the directory does not exist.
exec @CLI_DIR@?

block ptrace
block mount
block umount2
block kexec_load
block kexec_file_load
block init_module
block finit_module
block delete_module
block pivot_root
block chroot
block unshare
block setns
block bpf
block userfaultfd
block perf_event_open
block process_vm_readv
block process_vm_writev

env-deny LD_PRELOAD
env-deny LD_LIBRARY_PATH
env-deny LD_AUDIT

landlock on
seccomp on
no-new-privs on
env-sanitize on
