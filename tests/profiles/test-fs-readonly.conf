# test-fs-readonly.conf — read-only sandbox (deny_probe can't write anywhere)
#
# Filesystem: read-only system paths + fixture dir, NO rw paths
# seccomp: off (isolate Landlock testing)

ro /usr
ro /lib
ro /lib64
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev
ro /tmp/compartment-fixtures

landlock on
seccomp off
no-new-privs on
env-sanitize off
