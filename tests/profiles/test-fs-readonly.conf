# test-fs-readonly.conf — read-only sandbox (deny_probe can't write anywhere)
#
# Filesystem: read-only system paths + fixture dir, NO rw paths
# seccomp: off (isolate Landlock testing)

ro /usr
ro /lib
ro /lib64
ro /etc
ro /bin
ro /sbin
ro /proc
ro /dev
ro /tmp/compartment-fixtures

landlock on
no-new-privs on

# seccomp and env-sanitize stay on but have no rules, which is how this
# profile isolates Landlock: a profile may no longer switch a mechanism
# off (use the --no-seccomp / --no-env-sanitize flags for that).
seccomp on
env-sanitize on
