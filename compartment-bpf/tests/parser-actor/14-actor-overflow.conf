# ED-3 fixture 14: actor group declaring 5 paths must be rejected at
# parse time, since DEC-ED3-A unifies the parser cap with the BPF
# seal_value actor[] inline capacity (COMPARTMENT_MAX_ACTORS_PER_SEAL
# == 4). The error message must name "DEC-ED3-A" so a profile author
# who hits this in production can grep the codebase for the decision.
actor too-many = /usr/sbin/a /usr/sbin/b /usr/sbin/c /usr/sbin/d /usr/sbin/e

seal /etc/passwd no-write actor=too-many
