# Profile: sshd (OpenSSH server)
#
# Daemon name      : sshd
# Version on VM    : OpenSSH_10.2p1 Ubuntu-2ubuntu3, OpenSSL 3.5.5
# Systemd unit     : ssh.service
# ExecStart        : /usr/sbin/sshd -D $SSHD_OPTS
# Binary path      : /usr/sbin/sshd
#
# Main config paths (sealed):
#   /etc/ssh/sshd_config
#   /etc/ssh/sshd_config.d              (drop-in dir; contents pulled by sshd_config Include)
#   /etc/ssh/ssh_host_ed25519_key       (host key — confidentiality + integrity)
#   /etc/ssh/ssh_host_rsa_key
#   /etc/ssh/ssh_host_ecdsa_key
#   /etc/ssh/moduli                     (DH groups; tampering downgrades crypto)
#
# Runtime state (NOT sealed):
#   /run/sshd                           (privsep chroot dir)
#   /var/log/auth.log                   (sshd writes auth events via syslog)
#   /var/run/utmp, /var/log/wtmp, /var/log/btmp (login records, written by sshd)
#   /home/*/.ssh/authorized_keys        (per-user keys are user-managed, not daemon config)
#
# Liveness check:
#   systemctl is-active ssh && nc -z localhost 22

# Daemon binary
seal /usr/sbin/sshd                          full

# sshd_config + drop-in dir
seal /etc/ssh/sshd_config                    full
seal /etc/ssh/sshd_config.d                  full

# Host keys (read at startup; sshd does not rewrite these at runtime)
seal /etc/ssh/ssh_host_ed25519_key           full
seal /etc/ssh/ssh_host_rsa_key               full
seal /etc/ssh/ssh_host_ecdsa_key             full

# DH moduli — tampering downgrades KEX strength
seal /etc/ssh/moduli                         full

# Liveness: systemctl is-active ssh && nc -z localhost 22
