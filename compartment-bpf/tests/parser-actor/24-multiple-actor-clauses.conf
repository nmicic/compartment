# ME-8 §3.8 fixture: a single `seal` directive carrying TWO `actor=`
# clauses MUST be rejected. The grammar fixes one actor reference per
# seal line; otherwise the second clause silently shadowed the first
# in v0.3.
actor aide = /usr/sbin/aide
actor rkhunter = /usr/bin/rkhunter

seal /var/lib/aide/aide.db no-write actor=aide actor=rkhunter
