# ME-8 §3.8 fixture: actor declaration whose RHS path carries a glob
# metacharacter ('*'). The loader MUST NOT expand the glob — paths are
# literal. The resolver opens the literal '/tmp/.../glob-*' which does
# not exist; the failure mode is the same as a missing actor binary
# (fixture 09): "actor X: open ...: No such file or directory".
#
# Verifies the SECURE behaviour that an attacker controlling files in
# /tmp cannot use a glob to inject themselves as an actor.
actor globby = /tmp/parser-actor-glob-target-does-not-exist-*

seal /var/lib/aide/aide.db no-write actor=globby
