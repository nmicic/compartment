# compartment-bpf stability test profile (baseline / Loop A primary).
# Synthetic /tmp paths — no real service dependencies.
#
# Exercises all three ABI v0.5 surfaces:
#   - actor binary seal (ED-5: no actor= on the actor's own seal)
#   - parent-dir destination seal (ABI v0.5)
#   - per-file seal (ABI v0.3)
#
# Live runs create /tmp/stab-datadir and /tmp/stab-file in the harness
# before invoking --pin so the loader's stat() calls succeed.

actor stab_actor = /usr/bin/true

seal /usr/bin/true no-write,no-unlink,no-rename,no-chmod

seal /tmp/stab-datadir no-write,no-unlink,no-rename,no-chmod actor=stab_actor

seal /tmp/stab-file no-write,no-unlink actor=stab_actor
