# compartment-bpf stability test profile (Loop A dual-profile variant).
# Pairs with baseline-profile.conf for T-STAB-9: alternating profiles
# across pin/unpin cycles. Uses a different actor binary and distinct
# /tmp paths so the two profiles never share inode/path state.
#
# @STAB_ACTOR_B@ is rendered by stab_profile() into a real regular-file ELF
# with a distinct inode from @STAB_ACTOR@ (see tests/lib-realbin.sh); the
# literal /usr/bin/false it replaced is a symlink under uutils coreutils.

actor stab_actor_b = @STAB_ACTOR_B@

seal @STAB_ACTOR_B@ no-write,no-unlink,no-rename,no-chmod

seal /tmp/stab-datadir-b no-write,no-unlink,no-rename,no-chmod actor=stab_actor_b

seal /tmp/stab-file-b no-write,no-unlink actor=stab_actor_b
