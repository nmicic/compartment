# Example AIDE actor profile — strict-launch variant (ABI v0.4).
#
# Strict-launch mode (SPEC §3 prop 1-5; FEASIBILITY 2026-05-15 §12 verdict
# FEASIBLE) adds a kernel-side marker requirement on top of the v0.3
# actor= binary-identity check. The marker is set on `bprm_check_security`
# only when the exec target is the declared sealed launcher; subsequent
# protected file operations on a `strict-launch` seal then require:
#
#   1. Existing actor= inode match (the v0.3 check, unchanged).
#   2. A valid task-storage marker.
#   3. Marker.target equals current task's exe inode.
#   4. Marker.actor_slot matches the seal's strict_actor_slot.
#   5. Marker.policy_generation matches the loaded policy's generation.
#
# An attacker that exec's /usr/sbin/aide directly with LD_PRELOAD=evil.so
# bypasses the launcher; the kernel never sets a marker on that task; the
# strict-launch check fails with ACTION_DENY_STRICT_LAUNCH_MISSING (=8).
# This is the "LD_PRELOAD on an authorized actor" gap closed.
#
# IMPORTANT (operator-facing caveat, FEASIBILITY hard caveat):
#   The safe release shape is strict-launch ALONGSIDE the wrapper, with
#   LIMITATIONS.md continuing to say legacy `actor=` is binary-identity
#   only. Releasing strict-launch does NOT retroactively make plain
#   `actor=` clean-launch-safe. Use `actor-strict` for any actor whose
#   profile claims LD_PRELOAD-safe protection (AIDE in particular).
#
# Build the launcher (per-actor wrapper, static):
#   compartment-actor-build \
#       --name aide --cmd /usr/sbin/aide \
#       --out /usr/libexec/compartment-actors/aide
#
# This produces /usr/libexec/compartment-actors/aide as a statically
# linked binary that clearenv()s + injects only the env directives below
# + execve()s /usr/sbin/aide. The kernel hook records the
# launcher→target inode pair via the launcher_to_actor map and stamps
# the marker on the resulting task.

# v0.4 actor-strict declaration: the actor TARGET is /usr/sbin/aide,
# reached only through the static wrapper. Env policy is sourced from
# the wrapper (Review-1 HIGH-7 amend, 2026-05-15) — customize via
# `tools/compartment-actor-build.sh --allow-env PATH --allow-env TZ`
# when generating the wrapper. See HOWTO.md §6.4.
actor-strict aide = /usr/sbin/aide launcher=/usr/libexec/compartment-actors/aide

# Seal the launcher path so a privileged attacker cannot edit it to a
# different target after install. Required by strict_validate_launchers
# (the loader refuses an actor-strict whose launcher is not sealed
# `full` in the same profile).
seal /usr/libexec/compartment-actors/aide full

# Seal the actor target binary itself — required for the strict-launch
# loader-side gate too. Defends against package-upgrade and adversarial
# rewrite of the actor.
seal /usr/sbin/aide full

# AIDE's state file. `actor=aide` is the v0.3 inode binding; the new
# `strict-launch` flag adds the marker requirement on top.
seal /var/lib/aide/aide.db     no-write no-unlink no-rename actor=aide strict-launch
seal /var/lib/aide/aide.db.new no-write no-unlink no-rename actor=aide strict-launch

# Optional companion (operational defense in depth):
#   - /proc/sys/kernel/yama/ptrace_scope >= 2.
#   - systemd: NoNewPrivileges=yes; do NOT pass LD_PRELOAD in the unit
#     (the kernel's task_prctl + ptrace hooks block the most common
#     re-tamper paths, but cleanly-launched services compound the
#     defense).
#   - ExecStart=/usr/libexec/compartment-actors/aide --update
#     (NEVER ExecStart=/usr/sbin/aide directly — that exec misses the
#     launcher and the strict-launch check denies the subsequent write).
