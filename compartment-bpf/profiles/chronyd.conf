# Profile: chronyd
#
# Daemon name      : chronyd
# Version on VM    : chrony 4.8 (+CMDMON +REFCLOCK +RTC +PRIVDROP +SCFILTER +SIGND +NTS)
# Systemd unit     : chrony.service
# ExecStart        : /usr/lib/systemd/scripts/chronyd-starter.sh -n $DAEMON_OPTS
#                    (the wrapper exec's /usr/sbin/chronyd)
# Binary paths     :
#   /usr/sbin/chronyd                   (the actual daemon)
#   /usr/lib/systemd/scripts/chronyd-starter.sh  (the systemd-invoked wrapper)
#
# Main config paths (sealed):
#   /etc/chrony/chrony.conf
#   /etc/chrony/conf.d                  (drop-in dir)
#   /etc/chrony/sources.d               (NTP sources drop-in dir)
#   /etc/chrony/chrony.keys             (NTP authentication keys; mode 0640 root:_chrony)
#   /etc/chrony/nts-bootstrap-ubuntu.crt
#   /etc/chrony/nts-bootstrap-staging-ubuntu.crt
#                                        (NTS bootstrap CA bundles — tampering enables MITM)
#   /etc/default/chrony                 (sourced by chronyd-starter.sh on every start;
#                                        controls DAEMON_OPTS incl. -F seccomp level
#                                        and SYNC_IN_CONTAINER. Per Phase E audit.)
#
# Runtime state (NOT sealed):
#   /var/lib/chrony/                    (drift file, NTS state, RTC offset — daemon writes)
#   /run/chrony/chronyd.pid             (pid file)
#   /run/chrony/chronyd.sock            (cmdmon socket)
#
# Liveness check:
#   systemctl is-active chrony && chronyc tracking >/dev/null
#
# Note: the chrony.service ExecStart is the wrapper script — sealing
# both the wrapper and the underlying /usr/sbin/chronyd binary closes
# the substitution path on either side of the exec.

# Daemon binaries — both the wrapper and the real binary
seal /usr/sbin/chronyd                       full
seal /usr/lib/systemd/scripts/chronyd-starter.sh    full

# Main config + drop-in dirs
seal /etc/chrony/chrony.conf                 full
seal /etc/chrony/conf.d                      full
seal /etc/chrony/sources.d                   full

# NTP authentication keys + NTS bootstrap CA bundles
seal /etc/chrony/chrony.keys                 full
seal /etc/chrony/nts-bootstrap-ubuntu.crt    full
seal /etc/chrony/nts-bootstrap-staging-ubuntu.crt   full

# Wrapper sources this on every start — controls DAEMON_OPTS / -F seccomp
seal /etc/default/chrony                     full

# Liveness: systemctl is-active chrony && chronyc tracking >/dev/null
