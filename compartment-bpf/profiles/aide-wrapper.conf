# Example AIDE actor profile — wrapper-launched variant.
#
# Pairs with the per-actor wrapper produced by tools/compartment-actor-build.sh:
#   compartment-actor-build \
#       --name aide --cmd /usr/sbin/aide \
#       --out /usr/libexec/compartment-actors/aide
#
# IMPORTANT: the actor allowlist names /usr/sbin/aide, NOT the wrapper.
# After the wrapper execve()'s aide, current->mm->exe_file becomes aide's
# inode — the file-op BPF hook keys actor identity off that, so the
# wrapper's inode is invisible to the hook by the time aide writes its DB.
# The wrapper provides launch hygiene (env scrub + seccomp + fd close)
# from controlled service launches; it is not the actor identity.
#
# See: tests/results/exec-domain-decisions/DEC-WRAP-A.md
#      experimental/EXEC-DOMAIN-SPEC.md (wrapper section)
#      LIMITATIONS.md (in-process actor subversion)

actor aide = /usr/sbin/aide

# Seal the wrapper path so a privileged attacker cannot edit it to a
# different target after install. Wrapper itself is static-linked, mode
# 0755, owned by root.
seal /usr/libexec/compartment-actors/aide full

# Seal the real aide binary too — full set (no-write, no-unlink,
# no-rename, no-chmod). Defends against package-upgrade and adversarial
# rewrite of the actor itself.
seal /usr/sbin/aide full

# AIDE's two state files. Actor-bound so only aide can write/unlink/rename.
seal /var/lib/aide/aide.db     no-write no-unlink no-rename actor=aide
seal /var/lib/aide/aide.db.new no-write no-unlink no-rename actor=aide

# Optional companion (operational complement):
#   - /proc/sys/kernel/yama/ptrace_scope >= 2 (third-party-to-actor ptrace)
#   - systemd unit: NoNewPrivileges=yes, UnsetEnvironment=LD_PRELOAD ...,
#     CapabilityBoundingSet= without CAP_SYS_PTRACE/CAP_BPF/CAP_SYS_ADMIN.
#   - Service launch: ExecStart=/usr/libexec/compartment-actors/aide --update
