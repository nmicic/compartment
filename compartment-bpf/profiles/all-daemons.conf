seal /etc/postgresql-common/createcluster.conf full
actor postgres = /usr/lib/postgresql/18/bin/postgres
seal /var/lib/postgresql/18/main           no-write,no-unlink,no-rename actor=postgres
seal /var/lib/postgresql/18/main/PG_VERSION no-write,no-unlink,no-rename actor=postgres

