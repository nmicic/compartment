# Aggregate profile — union of all per-daemon profiles in profiles/.
# Generated by concatenating the seal directives from each
# profiles/<daemon>.conf. The parser does not support an include
# directive (only 'seal'), so this static file is the production
# artifact for loading the full cocktail in one shot.
#
# Re-generate with: tests/build-all-daemons-conf.sh
# Smoke with:       sudo ./compartment-bpf --pin profiles/all-daemons.conf
#
# Manifest headers per daemon live in profiles/<daemon>.conf.
# Profiles included (16): aide chronyd cron dbus-daemon nginx polkitd postfix postgres redis rsyslogd shells-allowlist sshd systemd-journald systemd-logind systemd-networkd systemd-resolved

# === aide ===
actor aide = /usr/sbin/aide
seal /usr/sbin/aide                          full
seal /var/lib/aide/aide.db                   no-write,no-unlink,no-rename actor=aide
seal /var/lib/aide/aide.db.new               no-write,no-unlink,no-rename actor=aide
seal /etc/aide/aide.conf                     full
seal /etc/aide/aide.conf.d                   full

# === chronyd ===
seal /usr/sbin/chronyd                       full
seal /usr/lib/systemd/scripts/chronyd-starter.sh    full
seal /etc/chrony/chrony.conf                 full
seal /etc/chrony/conf.d                      full
seal /etc/chrony/sources.d                   full
seal /etc/chrony/chrony.keys                 full
seal /etc/chrony/nts-bootstrap-ubuntu.crt    full
seal /etc/chrony/nts-bootstrap-staging-ubuntu.crt   full
seal /etc/default/chrony                     full

# === cron ===
seal /usr/sbin/cron                          full
seal /etc/crontab                            full
seal /etc/cron.d                             full
seal /etc/cron.daily                         full
seal /etc/cron.hourly                        full
seal /etc/cron.weekly                        full
seal /etc/cron.monthly                       full

# === dbus-daemon ===
seal /usr/bin/dbus-daemon                    full
seal /usr/share/dbus-1/system.conf           full
seal /etc/dbus-1/system.d                    full
seal /usr/share/dbus-1/system.d              full

# === nginx ===
seal /usr/sbin/nginx                         full
seal /etc/nginx/nginx.conf                   full
seal /etc/nginx/mime.types                   full
seal /etc/nginx/fastcgi.conf                 full
seal /etc/nginx/fastcgi_params               full
seal /etc/nginx/scgi_params                  full
seal /etc/nginx/uwsgi_params                 full
seal /etc/nginx/proxy_params                 full
seal /etc/nginx/conf.d                       full
seal /etc/nginx/modules-enabled              full

# === polkitd ===
seal /usr/lib/polkit-1/polkitd               full
seal /usr/share/polkit-1/polkitd.conf        full
seal /usr/share/polkit-1/actions             full
seal /usr/share/polkit-1/rules.d             full
seal /etc/polkit-1/rules.d                   full

