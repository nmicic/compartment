# Profile: dbus-daemon (system bus)
#
# Daemon name      : dbus-daemon
# Version on VM    : D-Bus Message Bus Daemon 1.16.2
# Systemd unit     : dbus.service
# ExecStart        : /usr/bin/dbus-daemon --system --address=systemd: --nofork --nopidfile --systemd-activation --syslog-only
# Binary path      : /usr/bin/dbus-daemon
#
# Main config paths (sealed):
#   /usr/share/dbus-1/system.conf       (top-level system bus policy — pulls includedir)
#   /etc/dbus-1/system.d                (admin policy drop-in dir)
#   /usr/share/dbus-1/system.d          (vendor policy drop-in dir)
#
# Runtime state (NOT sealed):
#   /run/dbus/system_bus_socket         (the bus socket itself — daemon binds + serves)
#   /var/lib/dbus/machine-id            (read at startup; rarely rewritten)
#
# Liveness check:
#   systemctl is-active dbus && dbus-send --system --dest=org.freedesktop.DBus \
#       --type=method_call --print-reply / org.freedesktop.DBus.ListNames >/dev/null
#
# Note: dbus-daemon is socket-activated by systemd; on restart, systemd
# re-creates the socket before respawn. Liveness check should tolerate
# a few hundred ms of unavailability.

# Daemon binary
seal /usr/bin/dbus-daemon                    full

# Top-level system bus policy
seal /usr/share/dbus-1/system.conf           full

# Policy drop-in directories (admin + vendor)
seal /etc/dbus-1/system.d                    full
seal /usr/share/dbus-1/system.d              full

# Liveness: dbus-send --system --dest=org.freedesktop.DBus --type=method_call \
#               --print-reply / org.freedesktop.DBus.ListNames >/dev/null
