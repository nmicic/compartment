# Profile: redis (in-memory key-value store / cache)
#
# Daemon name      : redis-server
# Version on VM    : # UNVERIFIED: redis-server not installed on draft runner;
#                    confirm with `redis-server --version` on target VM.
# Systemd unit     : redis-server.service
# ExecStart        : /usr/bin/redis-server /etc/redis/redis.conf --supervised systemd
# Binary path      : /usr/bin/redis-server
#                    (redis-cli, redis-check-aof, redis-check-rdb under /usr/bin)
#
# Main config paths (sealed):
#   /etc/redis/redis.conf               (top-level config)
#   /etc/redis/sentinel.conf            (only if redis-sentinel is installed; UNVERIFIED below)
#
# Runtime state (NOT sealed):
#   /var/lib/redis/                     (dump.rdb, appendonly.aof — daemon writes)
#   /var/log/redis/                     (redis-server.log)
#   /run/redis/                         (redis-server.pid, redis.sock)
#
# Liveness check:
#   systemctl is-active redis-server && redis-cli -s /run/redis/redis.sock ping
#
# Note: redis can rewrite its own config when CONFIG REWRITE is invoked
# (or after CONFIG SET on a directive marked rewriteable). Sealing the
# main config WILL break CONFIG REWRITE — that's the point — but it
# also means in-line tuning becomes a profile-unload-edit-reload event.
# Disable CONFIG REWRITE in your ops doctrine before loading this.
#
# Operational caveat:
#   Unpin or unload this profile before `apt upgrade` of redis / redis-server.
#   dpkg replaces sealed binaries by unlink+rename; the seal will refuse and
#   the upgrade aborts mid-transaction.

# Daemon binary + tooling
seal /usr/bin/redis-server                   full

# UNVERIFIED: redis-sentinel ships in the same package on Ubuntu and
# uses /usr/bin/redis-sentinel as a symlink-to-binary. If your deploy
# runs sentinel, uncomment.
# seal /usr/bin/redis-sentinel               full

# Main config file
seal /etc/redis/redis.conf                   full

# UNVERIFIED: sentinel.conf is rewritten by redis-sentinel at runtime
# (sentinels persist their state into this file). DO NOT seal full.
# Sealing breaks failover persistence. Left commented out as a warning.
# seal /etc/redis/sentinel.conf              full

# Liveness: systemctl is-active redis-server && redis-cli -s /run/redis/redis.sock ping
