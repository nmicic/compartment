# Profile: shells-allowlist (canonical shell tamper-protection)
#
# WHAT THIS DOES (in scope for compartment-bpf v0):
#   - Seals the canonical Linux shell binaries with the flag set
#     no-write,no-unlink,no-chmod. An attacker with CAP_DAC_OVERRIDE
#     cannot: overwrite /bin/bash with a trojaned binary (no-write);
#     unlink to atomically replace it (no-unlink); rename to drop a
#     new one in place (no-unlink / no-write covers the dentry-mutation
#     half via inode_rename); chmod the binary (no-chmod). The chmod
#     coverage closes two specific primitives: `chmod 0 /bin/bash`
#     (denial-of-service: nobody can exec the canonical shell anymore
#     and oncall tooling that shells into the box wedges) and
#     `chmod u+s /bin/bash` (privilege escalation: every invocation
#     of /bin/bash now runs as root regardless of the calling uid).
#   - The same flag set is applied to a small set of account-locking
#     and restricted interpreters (/usr/sbin/nologin, /bin/false,
#     /usr/bin/git-shell). These are not interactive shells in the
#     bash/dash/zsh sense, but the system treats them as valid
#     login-shell pivot surface (they appear in /etc/passwd shell
#     fields, /etc/shells, and are referenced by git-server +
#     account-locking workflows). The same trojan-replacement /
#     chmod-bypass primitives apply, so they belong in the same
#     profile.
#   - /etc/shells (consulted by chsh and PAM's pam_shells; NOT by cron,
#     direct execve, systemd ExecStart, sudo -s, or su -s) is also
#     sealed — its contents define which interpreters chsh/pam_shells
#     accept as "real shells".
#
# WHAT THIS DOES NOT DO (out of scope for compartment-bpf v0):
#   - It does NOT block exec of an unlisted shell. compartment-bpf
#     attaches inode-mutation and open hooks (file_open, inode_unlink,
#     inode_rename, file_truncate, inode_setattr, inode_setxattr,
#     mmap_file, and the rest of the seal cocktail in compartment.bpf.c)
#     but NOT bprm_check_security. An attacker can still place
#     /tmp/badshell and exec it.
#   - It does NOT enforce who can invoke a shell. PPID-chain checks,
#     UID allow-lists, socket-source / TTY / IP checks belong in
#     user-space tooling layered on top of this profile.
#   - The no-chmod flag covers chmod(2) / fchmod(2) / fchmodat(2) via
#     inode_setattr. It does NOT cover xattr-based caps (file_setxattr)
#     or filesystem-level capability bits set out-of-band (e.g. by
#     mounting the underlying block device); use the existing seal-
#     cocktail's inode_setxattr coverage and storage-layer hardening
#     for those.
#
# WHY IT IS USEFUL ANYWAY:
#   - Canonical shells are an extremely common post-exploit pivot.
#     Sealing them removes one of the easiest persistence vectors
#     (overwrite /bin/sh with a logging wrapper).
#   - The /etc/shells seal closes a quiet bypass: chsh refuses
#     interpreters not in /etc/shells, so freezing the file freezes
#     the allowed-login-shell set without needing kernel exec gating.
#
# WHAT MUST BE TRUE BEFORE LOADING THIS PROFILE:
#   - All listed shells you actually want must exist at the listed
#     paths AND be regular files, not symlinks. compartment-bpf opens
#     each path with O_PATH|O_NOFOLLOW and rejects symlink leaves (it
#     also rejects non-existent paths). On stock Ubuntu, /bin/sh,
#     /bin/rbash, and /usr/bin/sh are symlinks; the loader will refuse
#     the whole profile if those lines are uncommented. Their real
#     targets (/bin/dash and /bin/bash) are already covered below.
#   - You are NOT in the middle of a package upgrade that rewrites
#     /bin/bash. Unpin or unload the profile during dpkg upgrades.
#
# FUTURE WORK:
#   - Once compartment-bpf gains bprm_check_security + ACTION_DENY_EXEC,
#     this profile can be extended with allowlist semantics that
#     actually refuse to exec /tmp/badshell. v0 cannot do that.

seal /bin/bash                               no-write,no-unlink,no-chmod
# /bin/sh is a symlink to dash on Ubuntu; loader rejects symlink leaves.
# seal /bin/sh                               no-write,no-unlink,no-chmod
seal /bin/dash                               no-write,no-unlink,no-chmod
# /bin/rbash is a symlink to bash on Ubuntu; loader rejects symlink leaves.
# seal /bin/rbash                            no-write,no-unlink,no-chmod
seal /usr/bin/bash                           no-write,no-unlink,no-chmod
# /usr/bin/sh is a symlink to dash on Ubuntu; loader rejects symlink leaves.
# seal /usr/bin/sh                           no-write,no-unlink,no-chmod
seal /usr/bin/zsh                            no-write,no-unlink,no-chmod
seal /usr/bin/ksh                            no-write,no-unlink,no-chmod
seal /usr/bin/csh                            no-write,no-unlink,no-chmod
seal /usr/bin/tcsh                           no-write,no-unlink,no-chmod
seal /usr/bin/fish                           no-write,no-unlink,no-chmod
seal /usr/bin/busybox                        no-write,no-unlink,no-chmod
seal /etc/shells                             no-write,no-unlink,no-chmod

# Account-locking interpreters and restricted shells.
# These are not interactive shells, but appear in /etc/passwd shell
# fields and in /etc/shells; the system treats them as valid login-
# shell pivot surface. Trojan-replacement / chmod-bypass primitives
# apply identically, so they get the same flag set.
seal /usr/sbin/nologin                       no-write,no-unlink,no-chmod
seal /bin/false                              no-write,no-unlink,no-chmod
seal /usr/bin/git-shell                      no-write,no-unlink,no-chmod
