# Profile: systemd-networkd
#
# Daemon name      : systemd-networkd
# Version on VM    : systemd 259 (259.5-0ubuntu3)
# Systemd unit     : systemd-networkd.service
# ExecStart        : /usr/lib/systemd/systemd-networkd
# Binary path      : /usr/lib/systemd/systemd-networkd
#
# Main config paths (sealed):
#   /etc/systemd/networkd.conf
#   /etc/systemd/networkd.conf.d        (drop-in dir; cloud-init places overrides here)
#   /etc/systemd/network                (link/netdev/network unit dir; empty on stock cloud img)
#
# Runtime state (NOT sealed):
#   /run/systemd/netif                  (lease state, link state, dhcp leases)
#   /var/lib/systemd/network            (persistent state if any; usually empty)
#
# Liveness check:
#   systemctl is-active systemd-networkd && \
#       networkctl list --no-pager | grep -q routable
#
# Note: /etc/systemd/network is empty on stock cloud images (netplan
# generates configs into /run/systemd/network instead). Sealing the
# /etc directory still blocks an attacker placing override files there.
# /run/systemd/network is intentionally NOT sealed — netplan writes it.

# Daemon binary
seal /usr/lib/systemd/systemd-networkd       full

# Main config + drop-in dir + unit dir
seal /etc/systemd/networkd.conf              full
seal /etc/systemd/networkd.conf.d            full
seal /etc/systemd/network                    full

# Liveness: systemctl is-active systemd-networkd && \
#               networkctl list --no-pager | grep -q routable
