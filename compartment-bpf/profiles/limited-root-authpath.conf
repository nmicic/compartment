# Profile: limited-root-authpath (kernel half of the limited-root deployment)
#
# Pair with examples/limited-root.conf in the core repo.  The two halves
# answer DIFFERENT adversaries and neither is sufficient alone:
#
#   * examples/limited-root.conf binds the confined SESSION.  Landlock, a
#     seccomp filter, a capability bounding set and a private mount
#     namespace are per-task kernel state, inherited by every child and
#     impossible to widen.  They say nothing at all about a process that is
#     not in the session.
#   * THIS FILE binds the INODE.  It is what stops a uid-0 process that is
#     NOT in the session — cron, a systemd unit, an sshd session for an
#     account whose login shell is not the wrapper, a package hook — from
#     editing the login path out from under the confinement.  It is also
#     the only half that survives the confinement itself being bypassed.
#
# The clearest example of why both are needed is /etc/ld.so.preload.  A
# Landlock rule protects it from the session; but the file is read by the
# dynamic loader in *unconfined* processes, sshd included, so a write from
# anywhere else is a complete compromise of the login path.  Only a seal
# covers that side.
#
# Load with --pin.  Not as a daemon: in daemon mode the process can be
# killed by any same-uid process, and on Landlock ABI < 6 the confined
# session can send that signal.  --pin has no process to kill; the links
# live in the bpffs pin tree, which the session cannot reach because no
# Landlock rule in limited-root.conf grants /sys/fs/bpf.
#
#   sudo compartment-bpf --pin profiles/limited-root-authpath.conf
#
# Set COMPARTMENT_BPF_PASSPHRASE first (HOWTO §3.1).  Against a root that
# has had CAP_BPF taken away — which is precisely what limited-root.conf
# does — the passphrase gate is the wall in front of --unpin, and the
# Argon2id work factor is what makes a captured sentinel useless.
#
# PREFLIGHT
#   sysctl -w fs.protected_hardlinks=1        # HOWTO §1; actor= depends on it
#   : > /etc/ld.so.preload                    # must exist before it can be sealed
#   compartment-bpf --unpin                   # before any dpkg/apt run that
#                                             # rewrites a sealed file
#
# WHAT THIS DOES NOT DO
#   * It does not stop a process that holds CAP_BPF.  Such a process can
#     unlink the pin tree, delete the unpin sentinel and take the legacy
#     unpin path, or rewrite the task-storage marker map.  That boundary
#     is not this profile's; it belongs to the loader's own opt-in
#     self-protection, which ships in the same release — add
#     --self-protect to the --pin line above and the pin tree, the bpffs
#     mount and every map fd become loader-only (HOWTO 3.6; read the
#     upgrade rule there first, because an unauthorised successor image
#     cannot --unpin what this one pinned).  What this profile does on its
#     own is make CAP_BPF the *only* way in, and limited-root.conf takes
#     CAP_BPF away from the account.
#   * It does not gate exec.  compartment-bpf attaches no
#     bprm_check_security hook, so a dropped binary can still be run — it
#     just runs inside the session's Landlock domain and seccomp filter.
#   * Sealing a path pins the filesystem holding it: umount and
#     remount-ro return EBUSY until --unpin.  Sealed paths also refuse new
#     mounts on or under themselves, which is why nothing sealed here may
#     also appear as a `mask` line in limited-root.conf — the mask would
#     fail, and a failed mask refuses the login.

# ── Actors ───────────────────────────────────────────────────────────
#
# ED-5 strict mode: every binary named on an `actor` line must itself be
# sealed `full` at that exact path in this same profile, or the loader
# refuses the whole file.  If an attacker can swap the actor binary, the
# actor identity is forgeable.
#
# Only two actors are declared, and both are declared because a seal
# without them would break something that must keep working:
#
#   compartment  — the wrapper creates the session's audit records.  A
#                  sealed audit directory with no actor would silently turn
#                  auditing off, which is worse than not sealing it.
#   sshd         — declared but used on nothing below, because sshd does
#                  not rewrite any of its own configuration or host keys at
#                  runtime.  It is here so that an operator who needs to
#                  relax one line has the group ready and does not invent a
#                  looser one.  Delete it if you never use it.
#
# Note the actor identity is the caller's mm->exe_file inode.  A caller
# that can call prctl(PR_SET_MM, PR_SET_MM_EXE_FILE) can point that at the
# actor binary and inherit the identity; that needs CAP_SYS_RESOURCE, which
# limited-root.conf drops for exactly this reason.
#
# compartment-bpf has its own answer to that — comp_task_prctl denies the
# whole PR_SET_MM family — but it is gated on cur_strict_loaded(), so it is
# active only while a profile carrying a `strict-launch` seal is loaded.
# This profile uses plain `actor=`, so that gate is OFF and the capability
# drop in limited-root.conf is the only thing closing the forge inside the
# session; outside the session nothing closes it.  Turning it on means an
# `actor-strict` declaration and a statically linked launcher built with
# tools/compartment-actor-build.sh (HOWTO §2.3.x); it is worth doing and it
# is not free, which is why it is written down here rather than assumed.

actor compartment = /usr/local/bin/compartment-user
actor sshd        = /usr/sbin/sshd

# ── The enforcement itself ───────────────────────────────────────────
#
# Seal the wrapper, the loader and the policy the wrapper reads.  Without
# these the account can be un-confined at the next login instead of during
# this one.

seal /usr/local/bin/compartment-user         full
seal /usr/local/sbin/compartment-bpf         full
seal /etc/compartment                        full

# The shell stash.  Adjust to the directory `make hardened` generated; the
# default is /bin/shells.  Sealing it is what stops the "real" bash being
# replaced with something that is not a shell.
seal /bin/shells                             full

# ── sshd: binary, configuration, host keys ───────────────────────────
#
# No actor= on any of these: sshd reads them and never rewrites them.  The
# host keys are sealed for integrity as well as confidentiality — a swapped
# host key is a machine-in-the-middle for every future session.
#
# The sshd_config seal is doing more work here than it looks.  It is what
# makes the `Match User` block in HOWTO.md durable: without it the account
# could re-enable AllowStreamLocalForwarding and have sshd — which is
# outside the confinement — connect to the sockets limited-root.conf masks.

seal /usr/sbin/sshd                          full
seal /etc/ssh/sshd_config                    full
seal /etc/ssh/sshd_config.d                  full
seal /etc/ssh/ssh_host_ed25519_key           full
seal /etc/ssh/ssh_host_rsa_key               full
seal /etc/ssh/ssh_host_ecdsa_key             full
seal /etc/ssh/moduli                         full

# Authorized keys for every account whose shell is NOT the wrapper — those
# are the accounts a limited root would escape into.  Add one line per
# account; /root is the one that always exists.
seal /root/.ssh                              full

# ── PAM and the name service ─────────────────────────────────────────

seal /etc/pam.d                              full
seal /etc/security                           full
seal /etc/nsswitch.conf                      full

# ── The account database ─────────────────────────────────────────────
#
# Sealed shut, not actor-bound.  That means passwd(1), usermod(8) and
# chsh(1) stop working while the policy is loaded, which is the intended
# posture: a limited root that can add a uid-0 account with a normal shell
# has escaped.  Run --unpin for account maintenance.
#
# If an operator genuinely needs the shadow tools to keep working, the
# shape is (note ED-5: each actor binary must also be sealed full):
#
#   actor shadowtools = /usr/sbin/usermod /usr/bin/passwd /usr/sbin/useradd
#   seal /usr/sbin/usermod   full
#   seal /usr/bin/passwd     full
#   seal /usr/sbin/useradd   full
#   seal /etc/shadow         no-write,no-unlink,no-chmod actor=shadowtools
#
# Do not do that for /etc/passwd unless you have decided that "root may
# change any account's login shell" is acceptable — it is the shortest
# path out of this design.

seal /etc/passwd                             full
seal /etc/shadow                             full
seal /etc/group                              full
seal /etc/gshadow                            full
seal /etc/subuid                             full
seal /etc/subgid                             full
seal /etc/shells                             full
seal /etc/login.defs                         full

# ── Privilege escalation configuration ───────────────────────────────

seal /etc/sudoers                            full
seal /etc/sudoers.d                          full

# ── The dynamic loader's inputs ──────────────────────────────────────
#
# The highest-value entries in this file.  These are read by unconfined
# processes, so a Landlock rule protects only the wrong side.
# /etc/ld.so.preload does not exist on a stock Ubuntu — create it empty
# before loading this profile (`: > /etc/ld.so.preload`), or the loader
# refuses the whole file for a non-existent path.

seal /etc/ld.so.preload                      full
seal /etc/ld.so.cache                        full
seal /etc/ld.so.conf                         full
seal /etc/ld.so.conf.d                       full

# ── Session and shell startup ────────────────────────────────────────

seal /etc/environment                        full
seal /etc/profile                            full
seal /etc/profile.d                          full
seal /etc/bash.bashrc                        full

# ── Kernel module loading ────────────────────────────────────────────

seal /etc/modprobe.d                         full
seal /usr/lib/modules                        full

# ── Boot: the next-boot removal of lsm=...,bpf ───────────────────────
#
# The whole design rests on the kernel being booted with the bpf LSM
# active.  Editing the boot configuration is the way to remove it without
# touching anything this policy watches at runtime.
#
# /boot as a whole is NOT sealed: that would break every kernel upgrade.
# What is sealed is the generated config and the two inputs that generate
# it.  Run --unpin around a kernel or grub upgrade.

seal /etc/default/grub                       full
seal /etc/grub.d                             full
seal /boot/grub/grub.cfg                     full

# ── Scheduled and event-driven execution as unconfined root ──────────

seal /etc/crontab                            full
seal /etc/cron.d                             full
seal /etc/cron.daily                         full
seal /etc/cron.hourly                        full
seal /var/spool/cron/crontabs                full
seal /etc/init.d                             full
seal /etc/systemd/system                     full
seal /etc/apt/apt.conf.d                     full
seal /etc/apt/sources.list.d                 full
seal /etc/udev/rules.d                       full
seal /usr/lib/udev/rules.d                   full

# Present on some systems only; uncomment where they exist, since the
# loader refuses a profile naming a path that is not there.
# seal /etc/rc.local                         full
# seal /etc/sysctl.conf                      full
seal /etc/sysctl.d                           full

# ── The audit trail ──────────────────────────────────────────────────
#
# actor= here, not a shut seal: the wrapper has to be able to create and
# append the session's records.  Everything else — including the confined
# session itself once the wrapper has exec'd the shell — is refused, so the
# trail cannot be edited by the account it is a trail of.

seal /var/log/compartment                    no-write,no-unlink,no-chmod actor=compartment

# Liveness check after loading:
#   systemctl is-active ssh && ssh -o BatchMode=yes radmin@localhost id
#   compartment-bpf --stats
