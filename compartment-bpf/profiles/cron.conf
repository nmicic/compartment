# Profile: cron (vixie cron)
#
# Daemon name      : cron
# Version on VM    : Debian/Ubuntu vixie-cron (no -V flag exposed)
# Systemd unit     : cron.service
# ExecStart        : /usr/sbin/cron -f -P $EXTRA_OPTS
# Binary path      : /usr/sbin/cron
#
# Main config paths (sealed):
#   /etc/crontab
#   /etc/cron.d                         (drop-in jobs)
#   /etc/cron.daily, /etc/cron.hourly, /etc/cron.weekly, /etc/cron.monthly
#                                        (run-parts directories — scripts run as root)
#
# Runtime state (NOT sealed):
#   /var/spool/cron/crontabs            (per-user crontabs, written by `crontab -e`)
#   /run/crond.pid                      (pid file)
#   /var/log/syslog (cron logs via syslog)
#
# Liveness check:
#   systemctl is-active cron && pgrep -x cron >/dev/null
#
# Note: per-user crontabs (/var/spool/cron/crontabs/<user>) are
# intentionally NOT sealed — that path is the read/write surface for
# `crontab -e`. The integrity guarantee here is on the system-wide
# job set under /etc/cron.* and /etc/crontab.

# Daemon binary
seal /usr/sbin/cron                          full

# System crontab + drop-in jobs dir
seal /etc/crontab                            full
seal /etc/cron.d                             full

# run-parts directories — scripts here run as root on schedule
seal /etc/cron.daily                         full
seal /etc/cron.hourly                        full
seal /etc/cron.weekly                        full
seal /etc/cron.monthly                       full

# Liveness: systemctl is-active cron && pgrep -x cron >/dev/null
