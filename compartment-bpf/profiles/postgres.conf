# Profile: postgres (PostgreSQL relational database)
#
# Daemon name      : postgres
# Version on VM    : PostgreSQL 18 (Ubuntu 26.04 / Resolute, postgresql-18
#                    18.3-1, default cluster `main` on port 5432).
#                    VERIFIED on VM 2026-05-14 (Leader-7 ED-10 empirical
#                    validation, kernel 7.0.0-15 BPF LSM active).
#                    Substitute below if your deployment runs a different
#                    major; the paths embed the version literal.
# Systemd unit     : postgresql.service        (umbrella; starts the per-cluster units)
#                    postgresql@18-main.service (per-cluster, version+name)
# ExecStart        : /usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/18/main \
#                       -c config_file=/etc/postgresql/18/main/postgresql.conf
# Binary path      : /usr/lib/postgresql/18/bin/postgres
#                    (helpers: pg_ctl, pg_ctlcluster, initdb, psql under same prefix)
#
# Main config paths (sealed):
#   /etc/postgresql/18/main/postgresql.conf   (server config)
#   /etc/postgresql/18/main/pg_hba.conf       (host-based auth — security-critical)
#   /etc/postgresql/18/main/pg_ident.conf     (ident-to-PG-role map)
#   /etc/postgresql/18/main/conf.d            (drop-in dir, included by postgresql.conf)
#   /etc/postgresql/18/main/start.conf        (cluster start mode: auto/manual/disabled)
#   /etc/postgresql-common/createcluster.conf (cluster-default policy)
#
# Runtime state (NOT sealed):
#   /var/lib/postgresql/18/main/              (data dir — heap, WAL, indexes)
#   /var/log/postgresql/                      (per-cluster logs)
#   /var/run/postgresql/                      (.s.PGSQL.5432 socket, pid)
#
# Liveness check:
#   systemctl is-active postgresql && \
#       sudo -u postgres psql -c 'select 1' >/dev/null
#
# Directory-seal semantics:
#   The seal on /etc/postgresql/18/main/conf.d below is a directory seal:
#   it blocks create/unlink/rename of entries under the directory but does
#   NOT block in-place writes to existing drop-in files already present.
#   Per-file seals are required for that. If you have stable drop-ins
#   under conf.d/ whose contents must also freeze, add explicit per-file
#   seals on those drop-in paths.
#
# IMPORTANT: every path below embeds the major version (18). When the
# distro ships a new major (e.g. 19), pg_upgradecluster moves data into
# a NEW path tree (/etc/postgresql/19/main/, /var/lib/postgresql/19/main/)
# and the old paths linger until pg_dropcluster. UPDATE this profile on
# every major upgrade or sealing will silently target the dead cluster.
#
# Operational caveat:
#   Unpin or unload this profile before `apt upgrade` of postgresql-*.
#   dpkg replaces sealed binaries by unlink+rename; the seal will refuse
#   and the upgrade aborts mid-transaction.

# Daemon binary (verified at /usr/lib/postgresql/18/bin/postgres on the
# Resolute target; postgresql-common installs a versioned binary tree).
seal /usr/lib/postgresql/18/bin/postgres     full

# Wrapper / management binaries from postgresql-common (version-agnostic)
seal /usr/bin/pg_ctlcluster                  full
seal /usr/bin/pg_createcluster               full
seal /usr/bin/pg_dropcluster                 full

# Main config tree (per-cluster; substitute version + cluster name)
seal /etc/postgresql/18/main/postgresql.conf full
seal /etc/postgresql/18/main/pg_hba.conf     full
seal /etc/postgresql/18/main/pg_ident.conf   full
seal /etc/postgresql/18/main/conf.d          full
seal /etc/postgresql/18/main/start.conf      full

# postgresql-common cluster-default policy
seal /etc/postgresql-common/createcluster.conf full

# UNVERIFIED: TLS server cert / key for `ssl = on` clusters live by
# default at /etc/ssl/certs/ssl-cert-snakeoil.pem +
# /etc/ssl/private/ssl-cert-snakeoil.key (snakeoil) or under the
# data dir. Site-specific. Add explicit seals once the deployed
# paths are confirmed.
# seal /etc/ssl/private/<pg-host>.key         full
# seal /etc/ssl/certs/<pg-host>.crt           full

# ----------------------------------------------------------------------
# ED-10 — actor-bound seals on the data directory and version sentinel.
#
# SCOPE OF v0.x PROTECTION (R2-F5, Review-2 honest-framing demote):
#   * STRUCTURAL MUTATION GUARD on /var/lib/postgresql/<v>/main/ — the
#     dir seal blocks create / link / unlink / rename / mkdir / rmdir /
#     mknod / symlink of entries under the data dir to anyone but the
#     postgres actor. Roughly: "no one but postgres can shape the tree".
#   * PER-FILE WRITE PROTECTION on PG_VERSION — the cluster version
#     sentinel is sealed with actor=postgres, so its contents are
#     immutable to any caller that is not the postgres backend.
#
# WHAT THIS PROFILE DOES NOT DO IN v0.x:
#   * Heap files (base/<oid>/<relfilenode>) and WAL segments
#     (pg_wal/<segment>) are NOT individually sealed. v0.x has no
#     recursive-subtree-seal primitive — a dir seal alone does not
#     block in-place writes to existing files inside the dir
#     (file_open/file_truncate are checked against the file inode, not
#     the parent dir inode; see EXEC-DOMAIN-SPEC.md §2.1 "Directory-
#     seal semantics"). A root attacker on the box could still
#     `cat > /var/lib/postgresql/18/main/base/<oid>/<n>` and corrupt
#     specific heap pages. The structural-mutation guard does still
#     stop them from `mv old new` over a heap file or `rm` it.
#   * To freeze a specific file's content in v0.x, add a per-file
#     `seal <path> no-write,no-unlink,no-rename actor=postgres` line
#     for that path (see PG_VERSION below as the canonical example).
#
# v1.x SCOPE: recursive-subtree-seal so a single declaration covers
# the entire subtree. See the exec-domain design notes for the
# longer-term direction.
#
# Without an actor= clause the data dir would either be unsealable (the
# postgres backend MUST write its heap and WAL) or unwritable (sealing
# blocks everyone including postgres itself). The actor allowlist binds
# the writable surface to the postgres backend binary's exe (dev, ino),
# so anything-not-postgres trying to touch the data dir (structurally,
# per the scope note above) gets denied at the BPF LSM hook with
# ACTION_DENY_ACTOR_MISMATCH.
#
# Why not also seal `pg_ctl` as an actor? pg_ctl is a launcher — it
# fork+execs the postgres backend; the backend (not pg_ctl) is the
# process that opens and writes data files at runtime. The actor identity
# the hook compares against is `current->exe`, which after the exec is
# /usr/lib/postgresql/.../bin/postgres. Adding pg_ctl to the allowlist
# would not change the set of accepted writers — only the launcher
# inode would be checked, which doesn't appear on write hooks.
#
# Per SPEC §9 ED-10 substitution (see DEC-ED10-A.md): the SPEC text
# names "oracle" as the example actor-bound profile (legacy 2001
# reference). We ship "postgres" because oracle is not freely
# installable in CI / virtme — postgres exercises the same architectural
# property (one trusted writer; everyone else denied) on a stock Ubuntu
# package. Same shape, testable on the kernel matrix.
#
# Strict-mode (ED-5) requires the actor binary itself to carry a `full`
# seal at the exact declared path. The seal on
# /usr/lib/postgresql/18/bin/postgres above already provides this.

# The actor= clause path MUST match the binary path on disk exactly; the
# kernel resolves the (dev, ino) at load time via stat, so a stale "17"
# vs "18" mismatch fails the load with an `actor binary missing` error
# rather than silently misbehaving.
actor postgres = /usr/lib/postgresql/18/bin/postgres

# Data directory tree — structural-mutation guard ONLY (v0.x scope).
# Per the scope block at the top of this section, the dir-seal below
# blocks create / link / unlink / rename / mkdir of entries under the
# data dir but does NOT block in-place writes to heap files / WAL
# segments inside it. The per-file PG_VERSION seal below covers the
# version sentinel; v1.x recursive-subtree-seal will cover the rest.
# We use no-write,no-unlink,no-rename (not `full`) because postgres
# needs to chmod its own files in some maintenance paths (e.g. when
# replication slots toggle); no-chmod would be over-restrictive.
seal /var/lib/postgresql/18/main           no-write,no-unlink,no-rename actor=postgres
# Per-file PG_VERSION seal — this DOES block in-place writes (the LSM
# hook checks against PG_VERSION's own inode). Canonical v0.x answer
# for "no one but the actor may write file F".
seal /var/lib/postgresql/18/main/PG_VERSION no-write,no-unlink,no-rename actor=postgres

# Liveness: systemctl is-active postgresql && sudo -u postgres psql -c 'select 1' >/dev/null
