# Profile: rsyslogd
#
# Daemon name      : rsyslogd
# Version on VM    : 8.2512.0 (aka 2025.12)
# Systemd unit     : rsyslog.service
# ExecStart        : /usr/sbin/rsyslogd -n -iNONE
# Binary path      : /usr/sbin/rsyslogd
#
# Main config paths (sealed):
#   /etc/rsyslog.conf
#   /etc/rsyslog.d                      (drop-in dir; pulled by $IncludeConfig)
#
# Runtime state (NOT sealed):
#   /var/log/syslog, /var/log/auth.log, /var/log/kern.log, /var/log/mail.log
#                                        (all log targets rsyslog writes)
#   /var/spool/rsyslog                  (queue spool if disk-assisted queues used)
#
# Liveness check:
#   systemctl is-active rsyslog && pgrep -x rsyslogd >/dev/null && \
#       logger -t profile-smoke 'liveness ping' && sleep 1 && \
#       grep -q 'profile-smoke.*liveness ping' /var/log/syslog
#
# Note: rsyslog opens /dev/log (a Unix socket from systemd-journald via
# /run/systemd/journal/syslog) on startup; integrity of that socket is
# managed by systemd, not by this profile.

# Daemon binary
seal /usr/sbin/rsyslogd                      full

# Main config + drop-in dir
seal /etc/rsyslog.conf                       full
seal /etc/rsyslog.d                          full

# Liveness: systemctl is-active rsyslog && pgrep -x rsyslogd >/dev/null && \
#               logger -t profile-smoke 'liveness ping' && sleep 1 && \
#               grep -q 'profile-smoke.*liveness ping' /var/log/syslog
