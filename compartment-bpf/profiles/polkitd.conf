# Profile: polkitd (PolicyKit authority)
#
# Daemon name      : polkitd
# Version on VM    : polkit (Resolute default; package version on disk)
# Systemd unit     : polkit.service
# ExecStart        : /usr/lib/polkit-1/polkitd --no-debug --log-level=notice
# Binary path      : /usr/lib/polkit-1/polkitd
#
# Main config paths (sealed):
#   /usr/share/polkit-1/polkitd.conf    (top-level config)
#   /usr/share/polkit-1/actions         (vendor action policies)
#   /usr/share/polkit-1/rules.d         (vendor rules)
#   /etc/polkit-1/rules.d               (admin rules — drwxr-x--- root:polkitd)
#
# Runtime state (NOT sealed):
#   /run/polkit-1                       (runtime dir, may not exist on stock)
#
# Liveness check:
#   systemctl is-active polkit && dbus-send --system \
#       --dest=org.freedesktop.PolicyKit1 --type=method_call --print-reply \
#       /org/freedesktop/PolicyKit1/Authority org.freedesktop.DBus.Peer.Ping >/dev/null
#
# History note: CVE-2021-4034 (PwnKit) was a pkexec/argv flaw, not a
# config tamper. This profile guards against the *next* class of attack:
# silent edits to /etc/polkit-1/rules.d that grant unintended privileges.

# Daemon binary
seal /usr/lib/polkit-1/polkitd               full

# Top-level config
seal /usr/share/polkit-1/polkitd.conf        full

# Vendor action + rules dirs
seal /usr/share/polkit-1/actions             full
seal /usr/share/polkit-1/rules.d             full

# Admin rules dir (drwxr-x--- root:polkitd)
seal /etc/polkit-1/rules.d                   full

# Liveness: dbus-send --system --dest=org.freedesktop.PolicyKit1 \
#               --type=method_call --print-reply \
#               /org/freedesktop/PolicyKit1/Authority \
#               org.freedesktop.DBus.Peer.Ping >/dev/null
