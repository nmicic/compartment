# Profile: aide (Advanced Intrusion Detection Environment)
#
# Daemon name      : aide
# Version on VM    : 0.18.x (Ubuntu 26.04 default)
# Systemd unit     : aide.timer / aide.service (or cron in older deploys)
# Binary path      : /usr/sbin/aide
#
# Property protected (SPEC §2.1 AIDE row):
#   Root cannot edit the baseline /var/lib/aide/aide.db out-of-band.
#   Updating the baseline must go through `/usr/sbin/aide --update`,
#   which writes aide.db.new through the actor allowlist and is
#   audit-visible (the whitewash is observable, not silent). Normal
#   operator workflows (`aide --check`, `aide --update`) continue to
#   work because /usr/sbin/aide's exe inode is in the `aide` actor
#   group; off-binary tampering (vi, dd, cat >) is denied.
#
# Operational caveat:
#   Unpin (`compartment-bpf --unpin`) before `apt upgrade aide`. The
#   `full` seal on /usr/sbin/aide blocks the package manager from
#   replacing the binary in place. Re-pin after the upgrade so the
#   new binary's inode is captured under the actor group.
#
# Liveness check:
#   systemctl is-active aide.timer || systemctl is-active aide.service

# Actor binding: only this on-disk binary's exe inode is allowed past
# the actor-bound seals below.
actor aide = /usr/sbin/aide

# Daemon binary — strict-mode required by ED-5 (E-6 enforcement).
seal /usr/sbin/aide                          full

# Baseline DB + staging — actor-bound (aide may write; root may not).
# Per-file seals block in-place edits and renames of the DB. Directory-
# level sealing on /var/lib/aide is intentionally omitted: the per-file
# seals carry the integrity property, and a dir-level no-write would
# break `aide --init` (which creates aide.db.new in the parent dir).
seal /var/lib/aide/aide.db                   no-write,no-unlink,no-rename actor=aide
seal /var/lib/aide/aide.db.new               no-write,no-unlink,no-rename actor=aide

# Config (uniform-deny — no actor; tamper-resistant for everyone).
seal /etc/aide/aide.conf                     full
seal /etc/aide/aide.conf.d                   full

# Runtime / logs (NOT sealed):
#   /var/log/aide/aide.log
