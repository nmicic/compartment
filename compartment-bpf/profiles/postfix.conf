# Profile: postfix (SMTP MTA)
#
# Daemon name      : postfix (master process + per-service children)
# Version on VM    : # UNVERIFIED: postfix not installed on draft runner;
#                    confirm with `postconf mail_version` on target VM.
# Systemd unit     : postfix.service           (umbrella that drives postmulti)
#                    postfix@-.service         (the default "-" instance)
# ExecStart        : /usr/sbin/postfix start-fg
#                    (postfix(1) is the control wrapper; the long-lived
#                    process is /usr/lib/postfix/sbin/master)
# Binary paths     :
#   /usr/sbin/postfix                          (control / wrapper)
#   /usr/sbin/postconf                         (config inspection)
#   /usr/sbin/postmap                          (lookup-table compile)
#   /usr/sbin/postqueue, /usr/sbin/postsuper, /usr/sbin/postalias
#   /usr/lib/postfix/sbin/master               (the actual long-lived daemon)
#   /usr/lib/postfix/sbin/{smtpd,smtp,qmgr,pickup,cleanup,...}
#                                              (master-spawned per-service)
#
# Main config paths (sealed):
#   /etc/postfix/main.cf                       (the canonical Postfix config)
#   /etc/postfix/master.cf                     (service table — what master spawns)
#   /etc/postfix/postfix-files                 (file-permissions manifest used by post-install)
#   /etc/postfix/dynamicmaps.cf                (lookup-table plugin registry)
#   /etc/postfix/dynamicmaps.cf.d              (drop-in dir for dynamicmaps)
#
# Runtime state (NOT sealed):
#   /var/spool/postfix/                        (mail queue — per-service subdirs)
#   /var/lib/postfix/                          (master.lock, smtpd_scache, etc.)
#   /var/log/mail.log, /var/log/mail.err       (syslog destinations)
#   /run/postfix/                              (runtime sockets if configured)
#
# Pipe-alias risk:
#   /etc/postfix/aliases entries of the form `name: |/path/to/command`
#   execute /path/to/command as the postfix uid (via the local(8) delivery
#   agent and pipe(8) — see man 5 aliases and man 8 pipe). This is an
#   arbitrary-exec primitive that compartment-bpf alone cannot prevent:
#   sealing /etc/postfix/aliases stops modification of the file but the
#   referenced /path/to/command may still be unsealed and writable. We
#   recommend operators (a) audit /etc/aliases and /etc/postfix/aliases
#   for `|command` and `:include:` entries and seal those targets too,
#   and (b) layer a SELinux or AppArmor confinement on top of compartment-
#   bpf so that even uid=postfix cannot exec arbitrary binaries.
#
# Directory-seal semantics:
#   Directory seals (e.g. on /etc/postfix/dynamicmaps.cf.d below) block
#   create/unlink/rename of entries within the directory; they do NOT
#   block in-place writes to existing files under the directory. Per-file
#   seals are required for that. See the per-file seals on main.cf /
#   master.cf for the in-place-write coverage of the core config files.
#
# Lookup-table files (NOT sealed by default):
#   /etc/postfix/aliases, /etc/aliases         (rebuilt by newaliases → postmap)
#   /etc/postfix/*.db                          (compiled hash maps; postmap rewrites)
#   /etc/postfix/transport, /etc/postfix/access, /etc/postfix/canonical, etc.
#   These are admin-managed source files PLUS daemon-rewritten .db
#   compiled forms. Sealing them breaks `newaliases` and `postmap`.
#
# Liveness check:
#   systemctl is-active postfix && \
#       postfix status >/dev/null && \
#       echo QUIT | nc -w1 127.0.0.1 25 | grep -q '^220 '
#
# Operational caveat:
#   Unpin or unload this profile before `apt upgrade` of postfix.
#   dpkg replaces sealed binaries by unlink+rename; the seal will refuse and
#   the upgrade aborts mid-transaction.

# Wrapper + tooling under /usr/sbin
seal /usr/sbin/postfix                       full
seal /usr/sbin/postconf                      full
seal /usr/sbin/postmap                       full
seal /usr/sbin/postqueue                     full
seal /usr/sbin/postsuper                     full
seal /usr/sbin/postalias                     full

# sendmail(1) — postfix ships a sendmail-compatible wrapper at this path
# (Debian alternatives target). Sealing it closes the pipe-alias-adjacent
# exec surface where MUAs / cron jobs invoke /usr/sbin/sendmail directly.
seal /usr/sbin/sendmail                      full

# The actual long-lived master + per-service binaries
seal /usr/lib/postfix/sbin/master            full
seal /usr/lib/postfix/sbin/smtpd             full
seal /usr/lib/postfix/sbin/smtp              full
seal /usr/lib/postfix/sbin/qmgr              full
seal /usr/lib/postfix/sbin/pickup            full
seal /usr/lib/postfix/sbin/cleanup           full
seal /usr/lib/postfix/sbin/local             full
seal /usr/lib/postfix/sbin/trivial-rewrite   full
seal /usr/lib/postfix/sbin/bounce            full

# UNVERIFIED: additional master-spawned services exist
# (verify, anvil, scache, tlsmgr, postscreen, dnsblog, tlsproxy, ...).
# Add explicit seals once `ls /usr/lib/postfix/sbin/` is enumerated
# on the target VM.
# seal /usr/lib/postfix/sbin/anvil           full
# seal /usr/lib/postfix/sbin/tlsmgr          full
# seal /usr/lib/postfix/sbin/tlsproxy        full
# seal /usr/lib/postfix/sbin/postscreen      full

# Core config
seal /etc/postfix/main.cf                    full
seal /etc/postfix/master.cf                  full
seal /etc/postfix/postfix-files              full
seal /etc/postfix/dynamicmaps.cf             full
seal /etc/postfix/dynamicmaps.cf.d           full

# UNVERIFIED: TLS material — site-specific paths.
# seal /etc/postfix/tls/<host>.key             full
# seal /etc/postfix/tls/<host>.crt             full

# Liveness: systemctl is-active postfix && postfix status >/dev/null
