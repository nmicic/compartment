# Profile: systemd-journald
#
# Daemon name      : systemd-journald
# Version on VM    : systemd 259 (259.5-0ubuntu3)
# Systemd unit     : systemd-journald.service
# ExecStart        : /usr/lib/systemd/systemd-journald
# Binary path      : /usr/lib/systemd/systemd-journald
#
# Main config paths (sealed):
#   /etc/systemd/journald.conf
