#
# Liveness check:
#   systemctl is-active systemd-journald && journalctl -n 1 --no-pager >/dev/null

# Daemon binary
seal /usr/lib/systemd/systemd-journald       full

# Main config + vendor drop-in dir
seal /etc/systemd/journald.conf              full
seal /usr/lib/systemd/journald.conf.d        full

