# Profile: nginx (HTTP/reverse-proxy daemon)
#
# Daemon name      : nginx
# Version on VM    : # UNVERIFIED: nginx-core not installed on draft runner;
#                    confirm with `nginx -v` on target VM before loading.
# Systemd unit     : nginx.service
# ExecStart        : /usr/sbin/nginx -g 'daemon on; master_process on;'
# Binary path      : /usr/sbin/nginx
#
# Main config paths (sealed):
#   /etc/nginx/nginx.conf               (top-level config; pulls in the rest)
#   /etc/nginx/mime.types               (MIME type map; rarely changes)
#   /etc/nginx/fastcgi.conf             (canonical FastCGI param block)
#   /etc/nginx/fastcgi_params           (legacy FastCGI param block)
#   /etc/nginx/scgi_params              (SCGI param block)
#   /etc/nginx/uwsgi_params             (uWSGI param block)
#   /etc/nginx/proxy_params             (canonical proxy_pass header block)
#   /etc/nginx/conf.d                   (drop-in dir; pulled by nginx.conf Include)
#   /etc/nginx/modules-enabled          (dynamic module load drop-ins)
#
# Runtime state (NOT sealed):
#   /var/log/nginx/                     (access.log, error.log; nginx writes)
#   /var/cache/nginx/                   (proxy_cache / fastcgi_cache backing)
#   /var/lib/nginx/                     (body / proxy / scgi / uwsgi temp paths)
#   /run/nginx.pid                      (pid file)
#   /run/nginx/                         (systemd RuntimeDirectory if configured)
#
# Site config — NOT sealed by default (admins edit these regularly):
#   /etc/nginx/sites-available, /etc/nginx/sites-enabled
#   If your operational model freezes site config too, uncomment the
#   sites-* seals below.
#
# Directory-seal semantics:
#   The seals on /etc/nginx/conf.d and /etc/nginx/modules-enabled below
#   are directory seals: they block create/unlink/rename of entries under
#   the directory but do NOT block in-place writes to existing files
#   already present. Per-file seals are required for that. If you need
#   to freeze the contents of an individual drop-in, add an explicit
#   per-file seal on that file's full path.
#
# Liveness check:
#   systemctl is-active nginx && nginx -t && curl -fsS -o /dev/null http://127.0.0.1/
#
# Operational caveat:
#   Unpin or unload this profile before `apt upgrade` of nginx / nginx-core.
#   dpkg replaces sealed binaries by unlink+rename; the seal will refuse and
#   the upgrade aborts mid-transaction.

# Daemon binary
seal /usr/sbin/nginx                         full

# Top-level config file
seal /etc/nginx/nginx.conf                   full

# Static parameter blocks pulled in by includes (rarely edited at runtime)
seal /etc/nginx/mime.types                   full
seal /etc/nginx/fastcgi.conf                 full
seal /etc/nginx/fastcgi_params               full
seal /etc/nginx/scgi_params                  full
seal /etc/nginx/uwsgi_params                 full
seal /etc/nginx/proxy_params                 full

# Drop-in dirs (server blocks land here if you use the conf.d pattern)
seal /etc/nginx/conf.d                       full
seal /etc/nginx/modules-enabled              full

# UNVERIFIED: site config dirs are admin-edited; sealing them freezes
# the deployed virtual-host set. Uncomment only if your operational
# model treats site changes as a "reload the profile" event.
# seal /etc/nginx/sites-available             full
# seal /etc/nginx/sites-enabled               full

# UNVERIFIED: TLS material lives under /etc/ssl/ or /etc/letsencrypt/
# on different deployments. If your TLS keys live under a stable path,
# add explicit seals here — confidentiality + integrity matter for keys.
# seal /etc/ssl/private/<host>.key            full
# seal /etc/ssl/certs/<host>.crt              full

# Liveness: systemctl is-active nginx && nginx -t && curl -fsS -o /dev/null http://127.0.0.1/
