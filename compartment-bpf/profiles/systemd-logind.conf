# Profile: systemd-logind
#
# Daemon name      : systemd-logind
# Version on VM    : systemd 259 (259.5-0ubuntu3)
# Systemd unit     : systemd-logind.service
# ExecStart        : /usr/lib/systemd/systemd-logind
# Binary path      : /usr/lib/systemd/systemd-logind
#
# Main config paths (sealed):
#   /etc/systemd/logind.conf
#   /usr/lib/systemd/logind.conf.d      (vendor drop-in — contains
#                                        unattended-upgrades-logind-maxdelay.conf
#                                        on Resolute; per Phase E audit)
#   (no /etc/systemd/logind.conf.d/ on stock Resolute)
#
# Runtime state (NOT sealed):
#   /run/systemd/seats                  (seat state)
#   /run/systemd/sessions               (session state)
#   /run/systemd/users                  (per-user runtime state)
#   /run/utmp                           (login records via PAM, written through this daemon)
#
# Liveness check:
#   systemctl is-active systemd-logind && loginctl --no-pager >/dev/null
#
# Note: logind is the seat/session backend behind PAM session hooks. A
# tampered logind binary or config could weaken seat-bound device ACLs
# (uaccess), so binary + config integrity is the primary value here.

# Daemon binary
seal /usr/lib/systemd/systemd-logind         full

# Main config + vendor drop-in dir
seal /etc/systemd/logind.conf                full
seal /usr/lib/systemd/logind.conf.d          full

# Liveness: systemctl is-active systemd-logind && loginctl --no-pager >/dev/null
