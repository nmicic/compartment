# oracle.conf — the canonical "even root cannot wipe the database" demo
#
# `seal <path> <flagspec>` populates the BPF map at load time. The kernel
# enforces from then on, regardless of uid. Removing the seal requires
# either unloading the BPF program or removing the map entry — both of
# which are gated by CAP_BPF / CAP_SYS_ADMIN, which "sealed agent" mode
# strips after policy load (v1.5).
#
# flagspec:
#   full           = no-unlink + no-rename + no-write + no-chmod
#   no-unlink      = inode_unlink denied
#   no-rename      = inode_rename denied
#   no-write       = file_open with FMODE_WRITE denied
#   no-chmod       = chmod/chown/xattr-style metadata changes denied
#   any comma- or whitespace-separated combination

# Lock the database directory: nothing inside can be removed or renamed,
# even by uid 0. Equivalent to LIDS append-only / read-only ACL on a dir.
seal /var/lib/oracle           full

# The data file itself is also sealed for write — nothing writes new
# bytes through the file_open hook. Useful for static blobs (TLS keys,
# wallet files) or for an Oracle datafile during a maintenance window.
seal /var/lib/oracle/data      no-write,no-unlink,no-rename

# A few canonical "stop ransomware from overwriting these" examples:
seal /etc/shadow               no-write,no-unlink,no-rename
seal /etc/ssh/ssh_host_ed25519_key  no-write,no-unlink
