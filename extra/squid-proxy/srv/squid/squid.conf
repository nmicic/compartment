# squid.conf — minimal local forwarding proxy (loopback only, no disk cache)

# ── Listener ──────────────────────────────────────────────────────────
# start.sh runs the container with --network host, so this bind address is
# the *host's* loopback: nothing off-box and no sibling container on a Docker
# bridge can reach it.  With bridge networking a container cannot bind the
# host's loopback at all, and a bare "http_port 3128" would listen on every
# interface the container has — one `docker run -p` away from being an open
# relay on the LAN.
http_port 127.0.0.1:8080

# ── Access control ────────────────────────────────────────────────────
# This file REPLACES the distribution squid.conf rather than including it,
# so squid's shipped baseline ACLs do not apply and have to be restated
# here.  Without them squid will CONNECT to any port on any host for anyone
# who can reach it, which is what turns a forwarding proxy into an attack
# tool (SMTP relay, internal port scanner, database tunnel).
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Cache manager interface: local only, then denied outright.
http_access allow localhost manager
http_access deny manager

# Clients: loopback only.  "localhost" is squid's built-in ACL for
# 127.0.0.1/32 and ::1.  Everything else is denied — keep "deny all" last.
http_access allow localhost
http_access deny all

# ── Cache ─────────────────────────────────────────────────────────────
# No disk cache — pure forwarding proxy
cache deny all
cache_dir null /tmp

# ── Logs ──────────────────────────────────────────────────────────────
# /var/log/squid inside the container = /srv/logs on the host
access_log  /var/log/squid/access.log
cache_log   /var/log/squid/cache.log
pid_filename /var/run/squid/squid.pid

coredump_dir /tmp
