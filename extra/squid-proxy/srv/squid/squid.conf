# squid.conf — minimal local proxy (loopback only, no disk cache)

http_port 3128

# Allow all (loopback-only exposure, no auth needed)
http_access allow all

# No disk cache — pure forwarding proxy
cache deny all
cache_dir null /tmp

# Logs → /var/log/squid inside container = /srv/logs on host
access_log  /var/log/squid/access.log
cache_log   /var/log/squid/cache.log
pid_filename /var/run/squid/squid.pid

coredump_dir /tmp
