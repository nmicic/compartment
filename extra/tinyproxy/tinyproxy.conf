# tinyproxy.conf — local forwarding proxy → corporate upstream
# Listens:  127.0.0.1:8080  (loopback only)
# Upstream: http://proxy.corporation.com:8080

Port            8080
Listen          127.0.0.1
BindSame        yes
Timeout         600
MaxClients      100

# -- Daemon / process ----------------------------------------
Daemonize       Yes

# Paths are replaced by start.sh with absolute values at runtime
# (allows moving the directory without editing this file)
PidFile         __PIDFILE__
LogFile         __LOGFILE__
LogLevel        Info

# -- Access control ------------------------------------------
# Loopback only — no external access possible anyway
Allow           127.0.0.1

# -- Upstream corporate proxy --------------------------------
# tinyproxy will CONNECT through this for all requests
Upstream        http proxy.corporation.com:8080

# If your corporate proxy needs auth, use:
# Upstream   http user:password@proxy.corporation.com:8080

# -- Optional: bypass upstream for internal hostnames --------
# No "Upstream" line = direct connection for that pattern
# Upstream  none  .internal.corp
# Upstream  none  10.0.0.0/8
# Upstream  none  192.168.0.0/16

# -- Tuning --------------------------------------------------
ConnectPort     443
ConnectPort     563
DisableViaHeader No
